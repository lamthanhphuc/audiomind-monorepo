# Template only — not included in base kustomization.
# App secrets (JWT/tokens/provider). Database credentials live in audiomind-db-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: audiomind-secrets
  namespace: audiomind
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_IN_OVERLAY_WITH_AT_LEAST_32_CHARS"
  GF_SECURITY_ADMIN_USER: "REPLACE_IN_OVERLAY"
  GF_SECURITY_ADMIN_PASSWORD: "REPLACE_IN_OVERLAY"
  HUGGINGFACE_TOKEN: "REPLACE_IN_OVERLAY"
  INTERNAL_SERVICE_TOKEN: "REPLACE_IN_OVERLAY"
  GEMINI_API_KEY: "REPLACE_IN_OVERLAY"
