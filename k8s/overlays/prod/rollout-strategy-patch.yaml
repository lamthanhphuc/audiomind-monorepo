apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting-api-deployment
  namespace: audiomind
spec:
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      terminationGracePeriodSeconds: 45
