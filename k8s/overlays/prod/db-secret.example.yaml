# Example only — NOT included in Kustomize resources.
# Seal real values with kubeseal into sealed-db-secret.yaml encryptedData.
apiVersion: v1
kind: Secret
metadata:
  name: audiomind-db-secrets
  namespace: audiomind
type: Opaque
stringData:
  MEETING_DATABASE_URL: jdbc:postgresql://managed-db.example:5432/audiomind?sslmode=require
  USER_DATABASE_URL: jdbc:postgresql://managed-db.example:5432/audiomind?sslmode=require
  AI_DATABASE_URL: postgresql://dbuser:dbpass@managed-db.example:5432/audiomind?sslmode=require
  DB_USERNAME: dbuser
  DB_PASSWORD: dbpass
