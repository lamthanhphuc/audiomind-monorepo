apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../deployments/core-deployments.yaml
  - ../../services/core-services.yaml
  - ../../hpa/core-hpa.yaml
  - ../../observability/stack.yaml
  # SealedSecrets are applied by deploy after generate-sealed-secrets
  # (see sealed-secret.example.yaml / sealed-db-secret.example.yaml).
  - ../../jobs/db-migrate-jobs.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
patches:
  - path: configmap-patch.yaml
  - path: replicas-patch.yaml
  - path: resource-patch.yaml
  - path: app-env-patch.yaml
  - path: meeting-wait-user-schema-patch.yaml
  - path: rollout-strategy-patch.yaml
