# Example only — NOT included in Kustomize resources.
# Generate real ciphertext with scripts/generate-sealed-secrets.sh (or .ps1).
# Apply sealed-secret.generated.yaml during deploy; do not add this file to resources.
#
# Required env for generate-sealed-secrets (prod defaults STT_PROVIDER=local_whisper):
#   JWT_SECRET, INTERNAL_SERVICE_TOKEN, GEMINI_API_KEY,
#   GF_SECURITY_ADMIN_USER, GF_SECURITY_ADMIN_PASSWORD
#   HUGGINGFACE_TOKEN (required non-empty when ENABLE_SPEAKER_DIARIZATION=true;
#     otherwise seal with placeholder "disabled")
#   DEEPGRAM_API_KEY (only when STT_PROVIDER=deepgram)
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: audiomind-secrets
  namespace: audiomind
spec:
  encryptedData:
    # Replace each placeholder with output from: kubeseal --format yaml
    JWT_SECRET: REPLACE_WITH_SEALED_JWT_SECRET
    HUGGINGFACE_TOKEN: REPLACE_WITH_SEALED_HUGGINGFACE_TOKEN
    GF_SECURITY_ADMIN_USER: REPLACE_WITH_SEALED_GF_SECURITY_ADMIN_USER
    GF_SECURITY_ADMIN_PASSWORD: REPLACE_WITH_SEALED_GF_SECURITY_ADMIN_PASSWORD
    INTERNAL_SERVICE_TOKEN: REPLACE_WITH_SEALED_INTERNAL_SERVICE_TOKEN
    GEMINI_API_KEY: REPLACE_WITH_SEALED_GEMINI_API_KEY
    # Include only when STT_PROVIDER=deepgram:
    # DEEPGRAM_API_KEY: REPLACE_WITH_SEALED_DEEPGRAM_API_KEY
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
      name: audiomind-secrets
      namespace: audiomind
