apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: audiomind-db-secrets
  namespace: audiomind-staging
spec:
  encryptedData:
    # Replace each placeholder with: kubeseal --format yaml
    MEETING_DATABASE_URL: REPLACE_WITH_SEALED_MEETING_DATABASE_URL
    USER_DATABASE_URL: REPLACE_WITH_SEALED_USER_DATABASE_URL
    AI_DATABASE_URL: REPLACE_WITH_SEALED_AI_DATABASE_URL
    DB_USERNAME: REPLACE_WITH_SEALED_DB_USERNAME
    DB_PASSWORD: REPLACE_WITH_SEALED_DB_PASSWORD
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
      name: audiomind-db-secrets
      namespace: audiomind-staging
