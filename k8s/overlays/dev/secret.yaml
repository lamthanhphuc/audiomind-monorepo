apiVersion: v1
kind: Secret
metadata:
  name: audiomind-secrets
  namespace: audiomind
type: Opaque
stringData:
  POSTGRES_USER: dev_user
  POSTGRES_PASSWORD: dev_password
  DATABASE_URL: postgresql://dev_user:dev_password@db:5432/audiomind
  JWT_SECRET: development-jwt-secret-at-least-32-characters
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: dev_admin_password
  HUGGINGFACE_TOKEN: ""
  INTERNAL_SERVICE_TOKEN: development-internal-token
  GEMINI_API_KEY: development-placeholder
