apiVersion: v1
kind: Secret
metadata:
  name: audiomind-db-secrets
  namespace: audiomind
type: Opaque
stringData:
  # Shared managed/dev PostgreSQL instance; services own separate Flyway/Alembic histories.
  MEETING_DATABASE_URL: jdbc:postgresql://db:5432/audiomind
  USER_DATABASE_URL: jdbc:postgresql://db:5432/audiomind
  AI_DATABASE_URL: postgresql://dev_user:dev_password@db:5432/audiomind
  DB_USERNAME: dev_user
  DB_PASSWORD: dev_password
