# AudioMind Phase 2 — self-contained VPS Docker Compose (not for Kubernetes).
#
# Usage:
#   cp .env.production.example .env.production   # fill secrets on the VPS only
#   ./scripts/deploy-vps.sh
#
# Or manually:
#   docker compose --env-file .env.production -f infra/docker-compose.vps.yml up -d postgres redis
#   ./scripts/vps-migrate.sh
#   docker compose --env-file .env.production -f infra/docker-compose.vps.yml up -d --build

name: audiomind-vps

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &unless-stopped
  restart: unless-stopped

x-http-health: &http-health
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 40s

networks:
  audiomind-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  uploads:
  model-cache:

services:
  postgres:
    <<: *unless-stopped
    image: postgres:15.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audiomind}
      POSTGRES_USER: ${POSTGRES_USER:-audiomind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - audiomind-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  redis:
    <<: *unless-stopped
    image: redis:7.2.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks:
      - audiomind-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # One-shot migrate helpers (invoked by scripts/vps-migrate.sh — not started by default up).
  db-flyway-bootstrap:
    profiles: ["migrate"]
    build:
      context: ..
      dockerfile: infra/docker/flyway/bootstrap/Dockerfile
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-audiomind}
      FLYWAY_USER: ${POSTGRES_USER:-audiomind}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      FLYWAY_USER_TABLE: flyway_schema_history_user
      FLYWAY_MEETING_TABLE: flyway_schema_history_meeting
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - audiomind-network
    logging: *default-logging

  user-db-migrate:
    profiles: ["migrate"]
    build:
      context: ..
      dockerfile: infra/docker/flyway/user/Dockerfile
    command: ["-connectRetries=30", "migrate"]
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-audiomind}
      FLYWAY_USER: ${POSTGRES_USER:-audiomind}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      FLYWAY_TABLE: flyway_schema_history_user
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - audiomind-network
    logging: *default-logging

  meeting-db-migrate:
    profiles: ["migrate"]
    build:
      context: ..
      dockerfile: infra/docker/flyway/meeting/Dockerfile
    command: ["-connectRetries=30", "migrate"]
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-audiomind}
      FLYWAY_USER: ${POSTGRES_USER:-audiomind}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      FLYWAY_TABLE: flyway_schema_history_meeting
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - audiomind-network
    logging: *default-logging

  ai-db-migrate:
    profiles: ["migrate"]
    build:
      context: ..
      dockerfile: infra/docker/flyway/ai/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: ${AI_DATABASE_URL:?Set AI_DATABASE_URL in .env.production}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-vps}
      DATABASE_TLS_MODE: ${DATABASE_TLS_MODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - audiomind-network
    logging: *default-logging

  user-api:
    <<: *unless-stopped
    build:
      context: ../demoRecordAUDIOMID
      dockerfile: user-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-audiomind}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-audiomind}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      SPRING_FLYWAY_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env.production}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env.production}
      GOOGLE_INTERNAL_SERVICE_TOKEN: ${GOOGLE_INTERNAL_SERVICE_TOKEN:-${INTERNAL_SERVICE_TOKEN}}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_TOKEN_ENCRYPTION_KID: ${GOOGLE_TOKEN_ENCRYPTION_KID:-v1}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://127.0.0.1:8083/auth/google/callback}
      GOOGLE_OAUTH_LINK_REDIRECT_URI: ${GOOGLE_OAUTH_LINK_REDIRECT_URI:-http://127.0.0.1:8083/auth/google/link/callback}
      GOOGLE_OAUTH_FRONTEND_BASE_URL: ${GOOGLE_OAUTH_FRONTEND_BASE_URL:-${PUBLIC_ORIGIN:-http://127.0.0.1:8080}}
      GOOGLE_OAUTH_ALLOWED_REDIRECT_ORIGINS: ${GOOGLE_OAUTH_ALLOWED_REDIRECT_ORIGINS:-${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8080}}
      GOOGLE_OAUTH_STATE_TTL: ${GOOGLE_OAUTH_STATE_TTL:-10m}
      GOOGLE_LOGIN_TICKET_TTL: ${GOOGLE_LOGIN_TICKET_TTL:-90s}
      GOOGLE_LOGIN_TICKET_MARKER_TTL: ${GOOGLE_LOGIN_TICKET_MARKER_TTL:-10m}
      AUDIOMIND_MEETING_API_BASE_URL: http://meeting-api:8081
      AUDIOMIND_PROCESSING_API_BASE_URL: http://processing-api:8082
      NOTIFICATION_FRONTEND_BASE_URL: ${NOTIFICATION_FRONTEND_BASE_URL:-${PUBLIC_ORIGIN:-http://127.0.0.1:8080}}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: ${USER_REDIS_DB:-3}
      OTEL_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${USER_API_HOST_PORT:-8083}:8083"
    networks:
      - audiomind-network
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8083/actuator/health/readiness",
        ]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging: *default-logging

  meeting-api:
    <<: *unless-stopped
    build:
      context: ../demoRecordAUDIOMID
      dockerfile: meeting-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-audiomind}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-audiomind}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      SPRING_FLYWAY_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env.production}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env.production}
      GOOGLE_INTERNAL_SERVICE_TOKEN: ${GOOGLE_INTERNAL_SERVICE_TOKEN:-${INTERNAL_SERVICE_TOKEN}}
      USER_SERVICE_URL: http://user-api:8083
      GOOGLE_USER_SERVICE_URL: http://user-api:8083
      OTEL_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      user-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MEETING_API_HOST_PORT:-8081}:8081"
    networks:
      - audiomind-network
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8081/actuator/health/readiness",
        ]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging: *default-logging

  processing-api:
    <<: *unless-stopped
    build:
      context: ../demoRecordAUDIOMID
      dockerfile: processing-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env.production}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env.production}
      GOOGLE_INTERNAL_SERVICE_TOKEN: ${GOOGLE_INTERNAL_SERVICE_TOKEN:-${INTERNAL_SERVICE_TOKEN}}
      AUDIOMIND_AI_API_BASE_URL: http://ai-api:8000
      AUDIOMIND_MEETING_API_BASE_URL: http://meeting-api:8081
      AUDIOMIND_USER_API_BASE_URL: http://user-api:8083
      REDIS_HOST: redis
      REDIS_DB: "2"
      QUOTA_FAIL_OPEN: "false"
      OTEL_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
      meeting-api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROCESSING_API_HOST_PORT:-8082}:8082"
    networks:
      - audiomind-network
    healthcheck:
      <<: *http-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/ready"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 384M
    logging: *default-logging

  ai-api:
    <<: *unless-stopped
    build:
      context: ../demoRecordAUDIOMID/ai-service
      dockerfile: Dockerfile
      args:
        INSTALL_OFFLINE_STT: "false"
        INSTALL_OTEL: "false"
    environment:
      APP_ENV: production
      APP_COMPONENT: api
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-vps}
      DATABASE_TLS_MODE: ${DATABASE_TLS_MODE:-disable}
      DATABASE_URL: ${AI_DATABASE_URL:?Set AI_DATABASE_URL in .env.production}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      JOB_STATE_REDIS_URL: redis://redis:6379/2
      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?Set DEEPGRAM_API_KEY in .env.production}
      DEEPGRAM_LANGUAGE: ${DEEPGRAM_LANGUAGE:-vi}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-gemini}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env.production}
      ENABLE_SPEAKER_DIARIZATION: ${ENABLE_SPEAKER_DIARIZATION:-false}
      DEEPGRAM_DIARIZE: ${DEEPGRAM_DIARIZE:-false}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      LOCAL_WHISPER_ENABLED: "false"
      ALLOW_LEGACY_LOCAL_STT: "false"
      ALLOW_LEGACY_LOCAL_AI: "false"
      OLLAMA_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env.production}
      MEETING_SERVICE_BASE_URL: http://meeting-api:8081
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env.production}
      AUDIOMIND_USER_API_BASE_URL: http://user-api:8083
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      AUDIO_STORAGE_PATH: /app/uploads
      FINAL_AUDIO_ALLOWED_ROOTS: /app/uploads
      OTEL_SDK_DISABLED: "true"
    volumes:
      - model-cache:/app/models
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AI_API_HOST_PORT:-8000}:8000"
    networks:
      - audiomind-network
    healthcheck:
      <<: *http-health
      start_period: 60s
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).read()\"",
        ]
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.2"
          memory: 512M
    logging: *default-logging

  celery-worker:
    <<: *unless-stopped
    build:
      context: ../demoRecordAUDIOMID/ai-service
      dockerfile: Dockerfile
      args:
        INSTALL_OFFLINE_STT: "false"
        INSTALL_OTEL: "false"
    command:
      - /bin/sh
      - -c
      - >-
        celery -A app.celery_app.celery_app worker --loglevel=INFO
        --concurrency=$${CELERY_CONCURRENCY:-2}
        --prefetch-multiplier=$${CELERY_PREFETCH_MULTIPLIER:-1}
        -Q audio_processing,study_generation

    environment:
      APP_ENV: production
      APP_COMPONENT: worker
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-vps}
      DATABASE_TLS_MODE: ${DATABASE_TLS_MODE:-disable}
      DATABASE_URL: ${AI_DATABASE_URL:?Set AI_DATABASE_URL in .env.production}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      JOB_STATE_REDIS_URL: redis://redis:6379/2
      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?Set DEEPGRAM_API_KEY in .env.production}
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-gemini}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env.production}
      ENABLE_SPEAKER_DIARIZATION: ${ENABLE_SPEAKER_DIARIZATION:-false}
      DEEPGRAM_DIARIZE: ${DEEPGRAM_DIARIZE:-false}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      LOCAL_WHISPER_ENABLED: "false"
      ALLOW_LEGACY_LOCAL_STT: "false"
      ALLOW_LEGACY_LOCAL_AI: "false"
      OLLAMA_ENABLED: "false"
      MEETING_SERVICE_BASE_URL: http://meeting-api:8081
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env.production}
      AUDIOMIND_USER_API_BASE_URL: http://user-api:8083
      AUDIO_STORAGE_PATH: /app/uploads
      FINAL_AUDIO_ALLOWED_ROOTS: /app/uploads
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_PREFETCH_MULTIPLIER:-1}
      WORKER_HEALTH_PORT: "8080"
      OTEL_SDK_DISABLED: "true"
    volumes:
      - model-cache:/app/models
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    networks:
      - audiomind-network
    healthcheck:
      <<: *http-health
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).read()\"",
        ]
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.2"
          memory: 512M
    logging: *default-logging

  celery-beat:
    <<: *unless-stopped
    build:
      context: ../demoRecordAUDIOMID/ai-service
      dockerfile: Dockerfile
      args:
        INSTALL_OFFLINE_STT: "false"
        INSTALL_OTEL: "false"
    command:
      ["celery", "-A", "app.celery_app.celery_app", "beat", "--loglevel=INFO"]
    environment:
      APP_ENV: production
      APP_COMPONENT: beat
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      OTEL_SDK_DISABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    networks:
      - audiomind-network
    # Single replica: schedules study-generation-reconcile + analysis retries.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging: *default-logging

  frontend:
    <<: *unless-stopped
    build:
      context: ..
      dockerfile: FE-Audiomind/Dockerfile
      args:
        VITE_MEETING_API_BASE_URL: ${VITE_MEETING_API_BASE_URL:-__SAME_ORIGIN__}
        VITE_PROCESSING_API_BASE_URL: ${VITE_PROCESSING_API_BASE_URL:-__SAME_ORIGIN__}
        VITE_USER_API_BASE_URL: ${VITE_USER_API_BASE_URL:-__SAME_ORIGIN__}
        VITE_API_BASE: ${VITE_API_BASE:-__SAME_ORIGIN__}
        VITE_API_CPU_BASE: ${VITE_API_CPU_BASE:-__SAME_ORIGIN__}
        VITE_API_GPU_BASE: ${VITE_API_GPU_BASE:-__SAME_ORIGIN__}
        VITE_AI_SERVICE_URL: ${VITE_AI_SERVICE_URL:-}
        VITE_REALTIME_WS_ENABLED: ${VITE_REALTIME_WS_ENABLED:-true}
        VITE_REALTIME_WS_BASE_URL: ${VITE_REALTIME_WS_BASE_URL:-wss://your-domain.com/ws/meetings}
        VITE_GOOGLE_LOGIN_ENABLED: ${VITE_GOOGLE_LOGIN_ENABLED:-false}
        VITE_PAYOS_ENABLED: ${VITE_PAYOS_ENABLED:-false}
        VITE_REALTIME_ENABLED: ${VITE_REALTIME_ENABLED:-true}
        VITE_PUBLIC_FRONTEND_ORIGIN: ${VITE_PUBLIC_FRONTEND_ORIGIN:-${PUBLIC_ORIGIN:-https://your-domain.com}}
    depends_on:
      user-api:
        condition: service_healthy
      meeting-api:
        condition: service_healthy
      processing-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:80"
    networks:
      - audiomind-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging: *default-logging
