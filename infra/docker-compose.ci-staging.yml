# CI smoke overlay — Epic 3 + strict validation without multi-replica requirements.
# Usage:
#   docker compose -f infra/docker-compose.dev.yml \
#     -f infra/docker-compose.mvp.yml \
#     -f infra/docker-compose.ci.yml \
#     -f infra/docker-compose.staging.yml \
#     -f infra/docker-compose.ci-staging.yml up -d --build

services:
  processing-api:
    environment:
      EPIC3_TRANSCRIPT_QUALITY_ENABLED: "true"
      EPIC3_DOMAIN_LEXICON_ENABLED: "true"
      EPIC3_EVIDENCE_QA_ENABLED: "true"
      EPIC3_SEARCH_VERIFY_ENABLED: "true"
      EPIC3_EXPORT_VERIFY_ENABLED: "true"
      UPLOAD_VALIDATION_STRICT: "true"
      MIME_SNIFF_ENABLED: "true"
      REALTIME_VALIDATION_ENABLED: "true"
      ERROR_UX_ENABLED: "true"
      REALTIME_REDIS_STREAMS_ENABLED: "false"

  ai-api:
    environment:
      EPIC3_TRANSCRIPT_QUALITY_ENABLED: "true"
      EPIC3_DOMAIN_LEXICON_ENABLED: "true"
      EPIC3_EVIDENCE_QA_ENABLED: "true"
      EPIC3_SEARCH_VERIFY_ENABLED: "true"
      EPIC3_EXPORT_VERIFY_ENABLED: "true"
      GEMINI_SHARED_COOLDOWN_ENABLED: "false"

  celery-worker:
    environment:
      EPIC3_TRANSCRIPT_QUALITY_ENABLED: "true"
      EPIC3_DOMAIN_LEXICON_ENABLED: "true"
      EPIC3_EVIDENCE_QA_ENABLED: "true"
      EPIC3_SEARCH_VERIFY_ENABLED: "true"
      EPIC3_EXPORT_VERIFY_ENABLED: "true"
      GEMINI_SHARED_COOLDOWN_ENABLED: "false"

  user-api:
    environment:
      PAYOS_ENABLED: ${PAYOS_ENABLED:-false}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}

  web:
    build:
      args:
        VITE_GOOGLE_LOGIN_ENABLED: ${VITE_GOOGLE_LOGIN_ENABLED:-false}
        VITE_PAYOS_ENABLED: ${VITE_PAYOS_ENABLED:-false}
        VITE_REALTIME_ENABLED: ${VITE_REALTIME_ENABLED:-true}
