# Optional observability profile for local/VPS debug sessions.
# Usage:
#   docker compose ... --profile observability up -d jaeger

services:
  jaeger:
    image: jaegertracing/all-in-one:1.58
    profiles: [observability]
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
