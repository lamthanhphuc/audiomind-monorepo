# Staging overlay: Epic 3 transcript quality + stricter validation for pre-beta.

#

# Usage:

#   docker compose --env-file infra/.env \

#     -f infra/docker-compose.dev.yml \

#     -f infra/docker-compose.mvp.yml \

#     -f infra/docker-compose.staging.yml up -d --build



services:

  processing-api:

    environment:

      EPIC3_TRANSCRIPT_QUALITY_ENABLED: ${EPIC3_TRANSCRIPT_QUALITY_ENABLED:-true}

      EPIC3_DOMAIN_LEXICON_ENABLED: ${EPIC3_DOMAIN_LEXICON_ENABLED:-true}

      EPIC3_EVIDENCE_QA_ENABLED: ${EPIC3_EVIDENCE_QA_ENABLED:-true}

      EPIC3_SEARCH_VERIFY_ENABLED: ${EPIC3_SEARCH_VERIFY_ENABLED:-true}

      EPIC3_EXPORT_VERIFY_ENABLED: ${EPIC3_EXPORT_VERIFY_ENABLED:-true}

      ERROR_UX_ENABLED: ${ERROR_UX_ENABLED:-true}

      UPLOAD_VALIDATION_STRICT: ${UPLOAD_VALIDATION_STRICT:-true}

      MIME_SNIFF_ENABLED: ${MIME_SNIFF_ENABLED:-true}

      REALTIME_VALIDATION_ENABLED: ${REALTIME_VALIDATION_ENABLED:-true}

      QUOTA_FAIL_OPEN: ${QUOTA_FAIL_OPEN:-false}

      REALTIME_REDIS_STREAMS_ENABLED: ${REALTIME_REDIS_STREAMS_ENABLED:-true}



  ai-api:

    environment:

      AUDIOMIND_USER_API_BASE_URL: http://user-api:8083

      INTERNAL_SERVICE_TOKEN: ${GOOGLE_INTERNAL_SERVICE_TOKEN:-}

      QUOTA_FAIL_OPEN: ${QUOTA_FAIL_OPEN:-false}

      GEMINI_SHARED_COOLDOWN_ENABLED: ${GEMINI_SHARED_COOLDOWN_ENABLED:-true}

      EPIC3_TRANSCRIPT_QUALITY_ENABLED: ${EPIC3_TRANSCRIPT_QUALITY_ENABLED:-true}

      EPIC3_DOMAIN_LEXICON_ENABLED: ${EPIC3_DOMAIN_LEXICON_ENABLED:-true}

      EPIC3_EVIDENCE_QA_ENABLED: ${EPIC3_EVIDENCE_QA_ENABLED:-true}

      EPIC3_SEARCH_VERIFY_ENABLED: ${EPIC3_SEARCH_VERIFY_ENABLED:-true}

      EPIC3_EXPORT_VERIFY_ENABLED: ${EPIC3_EXPORT_VERIFY_ENABLED:-true}



  celery-worker:

    environment:

      AUDIOMIND_USER_API_BASE_URL: http://user-api:8083

      INTERNAL_SERVICE_TOKEN: ${GOOGLE_INTERNAL_SERVICE_TOKEN:-}

      QUOTA_FAIL_OPEN: ${QUOTA_FAIL_OPEN:-false}

      GEMINI_SHARED_COOLDOWN_ENABLED: ${GEMINI_SHARED_COOLDOWN_ENABLED:-true}

      EPIC3_TRANSCRIPT_QUALITY_ENABLED: ${EPIC3_TRANSCRIPT_QUALITY_ENABLED:-true}

      EPIC3_DOMAIN_LEXICON_ENABLED: ${EPIC3_DOMAIN_LEXICON_ENABLED:-true}

      EPIC3_EVIDENCE_QA_ENABLED: ${EPIC3_EVIDENCE_QA_ENABLED:-true}

      EPIC3_SEARCH_VERIFY_ENABLED: ${EPIC3_SEARCH_VERIFY_ENABLED:-true}

      EPIC3_EXPORT_VERIFY_ENABLED: ${EPIC3_EXPORT_VERIFY_ENABLED:-true}

