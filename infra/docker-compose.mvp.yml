# Application + automatic migration layer for AudioMind.
#
# Local (official):
#   docker compose --env-file infra/.env \
#     -f infra/docker-compose.dev.yml \
#     -f infra/docker-compose.mvp.yml \
#     up -d
#
# Migrations always run in the default graph (no --profile migrate).

x-restart-policy: &mvp-restart-policy
  restart: unless-stopped

x-http-healthcheck-defaults: &http-healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  db:
    <<: *mvp-restart-policy

  redis:
    <<: *mvp-restart-policy

  db-flyway-bootstrap:
    build:
      context: ..
      dockerfile: infra/docker/flyway/bootstrap/Dockerfile
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}
      FLYWAY_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      FLYWAY_USER_TABLE: flyway_schema_history_user
      FLYWAY_MEETING_TABLE: flyway_schema_history_meeting
    depends_on:
      db:
        condition: service_healthy

  user-db-migrate:
    build:
      context: ..
      dockerfile: infra/docker/flyway/user/Dockerfile
    command:
      - -connectRetries=30
      - migrate
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}
      FLYWAY_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      FLYWAY_TABLE: flyway_schema_history_user
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    depends_on:
      db-flyway-bootstrap:
        condition: service_completed_successfully

  meeting-db-migrate:
    build:
      context: ..
      dockerfile: infra/docker/flyway/meeting/Dockerfile
    command:
      - -connectRetries=30
      - migrate
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}
      FLYWAY_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      FLYWAY_TABLE: flyway_schema_history_meeting
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    depends_on:
      user-db-migrate:
        condition: service_completed_successfully

  ai-db-migrate:
    build:
      context: ..
      dockerfile: infra/docker/flyway/ai/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: ${AI_DATABASE_URL:-postgresql://${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}}
      DATABASE_TLS_MODE: ${DATABASE_TLS_MODE:-disable}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
    depends_on:
      meeting-db-migrate:
        condition: service_completed_successfully

  user-api:
    <<: *mvp-restart-policy
    build:
      context: ../demoRecordAUDIOMID
      dockerfile: user-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: ${USER_REDIS_DB:-3}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in infra/.env}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8083/auth/google/callback}
      GOOGLE_OAUTH_LINK_REDIRECT_URI: ${GOOGLE_OAUTH_LINK_REDIRECT_URI:-http://localhost:8083/auth/google/link/callback}
      GOOGLE_OAUTH_FRONTEND_BASE_URL: ${GOOGLE_OAUTH_FRONTEND_BASE_URL:-http://localhost:8080}
      GOOGLE_OAUTH_ALLOWED_REDIRECT_ORIGINS: ${GOOGLE_OAUTH_ALLOWED_REDIRECT_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:?Set GOOGLE_TOKEN_ENCRYPTION_KEY in infra/.env}
      GOOGLE_TOKEN_ENCRYPTION_KID: ${GOOGLE_TOKEN_ENCRYPTION_KID:-v1}
      GOOGLE_INTERNAL_SERVICE_TOKEN: ${GOOGLE_INTERNAL_SERVICE_TOKEN:?Set GOOGLE_INTERNAL_SERVICE_TOKEN in infra/.env}
      INTERNAL_SERVICE_TOKEN: ${GOOGLE_INTERNAL_SERVICE_TOKEN:?Set GOOGLE_INTERNAL_SERVICE_TOKEN in infra/.env}
      AUDIOMIND_MEETING_API_BASE_URL: http://meeting-api:8081
      AUDIOMIND_PROCESSING_API_BASE_URL: http://processing-api:8082
      NOTIFICATION_FRONTEND_BASE_URL: ${NOTIFICATION_FRONTEND_BASE_URL:-${PUBLIC_FRONTEND_ORIGIN:-${GOOGLE_OAUTH_FRONTEND_BASE_URL:-http://localhost:8080}}}
      NOTIFICATION_BRAND_NAME: ${NOTIFICATION_BRAND_NAME:-AudioMind}
      NOTIFICATION_BRAND_ACCENT_COLOR: ${NOTIFICATION_BRAND_ACCENT_COLOR:-#5b4bff}
      PAYOS_ENABLED: ${PAYOS_ENABLED:-false}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-http://localhost:8080/billing/success}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-http://localhost:8080/billing/cancel}
      BILLING_PRO_PRICE_VND: ${BILLING_PRO_PRICE_VND:-79000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-noreply@audiomind.local}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      MEETING_SHARE_NOTIFICATIONS_ENABLED: ${MEETING_SHARE_NOTIFICATIONS_ENABLED:-true}
      GMAIL_SEND_ENABLED: ${GMAIL_SEND_ENABLED:-true}
      ZOOM_OAUTH_ENABLED: ${ZOOM_OAUTH_ENABLED:-false}
      ZOOM_OAUTH_CLIENT_ID: ${ZOOM_OAUTH_CLIENT_ID:-}
      ZOOM_OAUTH_CLIENT_SECRET: ${ZOOM_OAUTH_CLIENT_SECRET:-}
      ZOOM_OAUTH_REDIRECT_URI: ${ZOOM_OAUTH_REDIRECT_URI:-http://localhost:8083/auth/zoom/callback}
      ZOOM_OAUTH_FRONTEND_BASE_URL: ${ZOOM_OAUTH_FRONTEND_BASE_URL:-http://localhost:8080}
      ZOOM_TOKEN_ENCRYPTION_KEY: ${ZOOM_TOKEN_ENCRYPTION_KEY:-}
      ZOOM_TOKEN_ENCRYPTION_KID: ${ZOOM_TOKEN_ENCRYPTION_KID:-v1}
      TEAMS_OAUTH_ENABLED: ${TEAMS_OAUTH_ENABLED:-false}
      TEAMS_OAUTH_CLIENT_ID: ${TEAMS_OAUTH_CLIENT_ID:-}
      TEAMS_OAUTH_CLIENT_SECRET: ${TEAMS_OAUTH_CLIENT_SECRET:-}
      TEAMS_OAUTH_REDIRECT_URI: ${TEAMS_OAUTH_REDIRECT_URI:-http://localhost:8083/auth/teams/callback}
      TEAMS_OAUTH_FRONTEND_BASE_URL: ${TEAMS_OAUTH_FRONTEND_BASE_URL:-http://localhost:8080}
      TEAMS_OAUTH_TENANT_ID: ${TEAMS_OAUTH_TENANT_ID:-common}
      TEAMS_TOKEN_ENCRYPTION_KEY: ${TEAMS_TOKEN_ENCRYPTION_KEY:-}
      TEAMS_TOKEN_ENCRYPTION_KID: ${TEAMS_TOKEN_ENCRYPTION_KID:-v1}
      TEAMS_OAUTH_STATE_TTL: ${TEAMS_OAUTH_STATE_TTL:-10m}
      TEAMS_OAUTH_ALLOWED_REDIRECT_ORIGINS: ${TEAMS_OAUTH_ALLOWED_REDIRECT_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-db-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${USER_API_HOST_PORT:-8083}:8083"
    healthcheck:
      <<: *http-healthcheck-defaults
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/ready"]

  meeting-api:
    <<: *mvp-restart-policy
    build:
      context: ../demoRecordAUDIOMID
      dockerfile: meeting-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in infra/.env}
      GOOGLE_USER_SERVICE_URL: http://user-api:8083
      USER_SERVICE_URL: http://user-api:8083
      GOOGLE_INTERNAL_SERVICE_TOKEN: ${GOOGLE_INTERNAL_SERVICE_TOKEN:?Set GOOGLE_INTERNAL_SERVICE_TOKEN in infra/.env}
      GOOGLE_CALENDAR_API_BASE_URL: ${GOOGLE_CALENDAR_API_BASE_URL:-https://www.googleapis.com/calendar/v3}
    depends_on:
      db:
        condition: service_healthy
      meeting-db-migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${MEETING_API_HOST_PORT:-8081}:8081"
    healthcheck:
      <<: *http-healthcheck-defaults
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/ready"]

  ai-api:
    <<: *mvp-restart-policy
    build:
      context: ../demoRecordAUDIOMID/ai-service
      args:
        INSTALL_OFFLINE_STT: "false"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_COMPONENT: api
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
      DATABASE_TLS_MODE: ${DATABASE_TLS_MODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env}
      DATABASE_URL: ${AI_DATABASE_URL:-postgresql://${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}}
      AUDIO_STORAGE_PATH: /app/uploads
      FINAL_AUDIO_ALLOWED_ROOTS: /app/uploads
      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?Set DEEPGRAM_API_KEY in infra/.env}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      DEEPGRAM_REALTIME_MODEL: ${DEEPGRAM_REALTIME_MODEL:-nova-3}
      DEEPGRAM_BATCH_MODEL: ${DEEPGRAM_BATCH_MODEL:-nova-3}
      DEEPGRAM_LANGUAGE: ${DEEPGRAM_LANGUAGE:-vi}
      DEEPGRAM_BASE_URL: ${DEEPGRAM_BASE_URL:-https://api.deepgram.com/v1/listen}
      DEEPGRAM_SMART_FORMAT: ${DEEPGRAM_SMART_FORMAT:-true}
      DEEPGRAM_UTTERANCES: ${DEEPGRAM_UTTERANCES:-true}
      DEEPGRAM_PARAGRAPHS: ${DEEPGRAM_PARAGRAPHS:-true}
      DEEPGRAM_SIMPLIFY_STREAMING_URL: ${DEEPGRAM_SIMPLIFY_STREAMING_URL:-false}
      DEEPGRAM_DEBUG_RAW_MESSAGES: ${DEEPGRAM_DEBUG_RAW_MESSAGES:-false}
      ENABLE_SPEAKER_DIARIZATION: ${ENABLE_SPEAKER_DIARIZATION:-true}
      DEEPGRAM_DIARIZE: ${DEEPGRAM_DIARIZE:-true}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in infra/.env}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MULTI_KEY_ENABLED: ${GEMINI_MULTI_KEY_ENABLED:-false}
      GEMINI_KEY_PROJECT_GROUPS: ${GEMINI_KEY_PROJECT_GROUPS:-}
      GEMINI_CROSS_PROJECT_FAILOVER_ENABLED: ${GEMINI_CROSS_PROJECT_FAILOVER_ENABLED:-false}
      GEMINI_MODEL_FALLBACK_ENABLED: ${GEMINI_MODEL_FALLBACK_ENABLED:-false}
      GEMINI_PRO_FALLBACK_ENABLED: ${GEMINI_PRO_FALLBACK_ENABLED:-false}
      GEMINI_MAX_TOTAL_ATTEMPTS: ${GEMINI_MAX_TOTAL_ATTEMPTS:-2}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-2}
      GEMINI_MAX_SCHEMA_RETRIES: ${GEMINI_MAX_SCHEMA_RETRIES:-1}
      GEMINI_MAX_TOKEN_RETRIES: ${GEMINI_MAX_TOKEN_RETRIES:-1}
      GEMINI_KEY_COOLDOWN_SECONDS: ${GEMINI_KEY_COOLDOWN_SECONDS:-90}
      GEMINI_KEY_HARD_COOLDOWN_SECONDS: ${GEMINI_KEY_HARD_COOLDOWN_SECONDS:-900}
      GEMINI_BACKOFF_BASE_MS: ${GEMINI_BACKOFF_BASE_MS:-500}
      GEMINI_BACKOFF_MAX_MS: ${GEMINI_BACKOFF_MAX_MS:-10000}
      GEMINI_BACKOFF_JITTER: ${GEMINI_BACKOFF_JITTER:-true}
      GEMINI_FAIL_FAST_SECONDS: ${GEMINI_FAIL_FAST_SECONDS:-30}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_ANALYSIS_MODEL: ${GEMINI_ANALYSIS_MODEL:-gemini-3.1-flash-lite}
      GEMINI_SUMMARY_MODEL: ${GEMINI_SUMMARY_MODEL:-gemini-3.1-flash-lite}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.2}
      GEMINI_CHAT_MAX_OUTPUT_TOKENS: ${GEMINI_CHAT_MAX_OUTPUT_TOKENS:-1200}
      GEMINI_SUMMARY_MAX_OUTPUT_TOKENS: ${GEMINI_SUMMARY_MAX_OUTPUT_TOKENS:-2048}
      GEMINI_STRUCTURED_ANALYSIS_MAX_OUTPUT_TOKENS: ${GEMINI_STRUCTURED_ANALYSIS_MAX_OUTPUT_TOKENS:-4096}
      GEMINI_STUDY_ARTIFACT_MAX_OUTPUT_TOKENS: ${GEMINI_STUDY_ARTIFACT_MAX_OUTPUT_TOKENS:-12288}
      GEMINI_COST_GUARD_ENABLED: ${GEMINI_COST_GUARD_ENABLED:-true}
      GEMINI_COST_GUARD_NAMESPACE: ${GEMINI_COST_GUARD_NAMESPACE:-audiomind-local-cost-test}
      GEMINI_DAILY_REQUEST_LIMIT_PER_USER: ${GEMINI_DAILY_REQUEST_LIMIT_PER_USER:-5}
      GEMINI_DAILY_REANALYZE_LIMIT_PER_MEETING: ${GEMINI_DAILY_REANALYZE_LIMIT_PER_MEETING:-2}
      GEMINI_DAILY_TOKEN_LIMIT_PER_USER: ${GEMINI_DAILY_TOKEN_LIMIT_PER_USER:-30000}
      GEMINI_MAX_CONCURRENT_REQUESTS: ${GEMINI_MAX_CONCURRENT_REQUESTS:-1}
      LOCAL_WHISPER_ENABLED: "false"
      ALLOW_LEGACY_LOCAL_STT: "false"
      OLLAMA_ENABLED: "false"
      ALLOW_LEGACY_LOCAL_AI: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in infra/.env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JOB_STATE_REDIS_URL: redis://redis:6379/2
      STT_ENABLE_DISTRIBUTED_OWNERSHIP: ${STT_ENABLE_DISTRIBUTED_OWNERSHIP:-true}
      STT_OWNERSHIP_ENABLED: ${STT_OWNERSHIP_ENABLED:-true}
      STT_OWNERSHIP_REDIS_URL: redis://redis:6379/2
      AUDIOMIND_USER_API_BASE_URL: http://user-api:8083
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-${GOOGLE_INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in infra/.env}}
      MEETING_SERVICE_BASE_URL: http://meeting-api:8081
      QUOTA_FAIL_OPEN: ${QUOTA_FAIL_OPEN:-false}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-300}
      GEMINI_HTTP_PROXY: ${GEMINI_HTTP_PROXY:-}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://ai-api:8000}
      GEMINI_SHARED_COOLDOWN_ENABLED: ${GEMINI_SHARED_COOLDOWN_ENABLED:-false}
      EPIC3_TRANSCRIPT_QUALITY_ENABLED: ${EPIC3_TRANSCRIPT_QUALITY_ENABLED:-false}
      EPIC3_DOMAIN_LEXICON_ENABLED: ${EPIC3_DOMAIN_LEXICON_ENABLED:-false}
      EPIC3_EVIDENCE_QA_ENABLED: ${EPIC3_EVIDENCE_QA_ENABLED:-false}
      EPIC3_SEARCH_VERIFY_ENABLED: ${EPIC3_SEARCH_VERIFY_ENABLED:-false}
      EPIC3_EXPORT_VERIFY_ENABLED: ${EPIC3_EXPORT_VERIFY_ENABLED:-false}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-db-migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
      - model_cache:/app/models
      - job_status:/app/storage
    ports:
      - "127.0.0.1:${AI_API_HOST_PORT:-8000}:8000"
    healthcheck:
      <<: *http-healthcheck-defaults
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).read()"
      start_period: 60s

  celery-worker:
    <<: *mvp-restart-policy
    build:
      context: ../demoRecordAUDIOMID/ai-service
      args:
        INSTALL_OFFLINE_STT: "false"
    command: sh -c "celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=$${CELERY_CONCURRENCY:-2} --prefetch-multiplier=$${CELERY_PREFETCH_MULTIPLIER:-1} -Q audio_processing,study_generation"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_COMPONENT: worker
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
      DATABASE_TLS_MODE: ${DATABASE_TLS_MODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env}
      DATABASE_URL: ${AI_DATABASE_URL:-postgresql://${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}}
      AUDIO_STORAGE_PATH: /app/uploads
      FINAL_AUDIO_ALLOWED_ROOTS: /app/uploads
      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?Set DEEPGRAM_API_KEY in infra/.env}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      DEEPGRAM_REALTIME_MODEL: ${DEEPGRAM_REALTIME_MODEL:-nova-3}
      DEEPGRAM_BATCH_MODEL: ${DEEPGRAM_BATCH_MODEL:-nova-3}
      DEEPGRAM_LANGUAGE: ${DEEPGRAM_LANGUAGE:-vi}
      DEEPGRAM_BASE_URL: ${DEEPGRAM_BASE_URL:-https://api.deepgram.com/v1/listen}
      DEEPGRAM_SMART_FORMAT: ${DEEPGRAM_SMART_FORMAT:-true}
      DEEPGRAM_UTTERANCES: ${DEEPGRAM_UTTERANCES:-true}
      DEEPGRAM_PARAGRAPHS: ${DEEPGRAM_PARAGRAPHS:-true}
      ENABLE_SPEAKER_DIARIZATION: ${ENABLE_SPEAKER_DIARIZATION:-true}
      DEEPGRAM_DIARIZE: ${DEEPGRAM_DIARIZE:-true}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in infra/.env}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MULTI_KEY_ENABLED: ${GEMINI_MULTI_KEY_ENABLED:-false}
      GEMINI_KEY_PROJECT_GROUPS: ${GEMINI_KEY_PROJECT_GROUPS:-}
      GEMINI_CROSS_PROJECT_FAILOVER_ENABLED: ${GEMINI_CROSS_PROJECT_FAILOVER_ENABLED:-false}
      GEMINI_MODEL_FALLBACK_ENABLED: ${GEMINI_MODEL_FALLBACK_ENABLED:-false}
      GEMINI_PRO_FALLBACK_ENABLED: ${GEMINI_PRO_FALLBACK_ENABLED:-false}
      GEMINI_MAX_TOTAL_ATTEMPTS: ${GEMINI_MAX_TOTAL_ATTEMPTS:-2}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-2}
      GEMINI_MAX_SCHEMA_RETRIES: ${GEMINI_MAX_SCHEMA_RETRIES:-1}
      GEMINI_MAX_TOKEN_RETRIES: ${GEMINI_MAX_TOKEN_RETRIES:-1}
      GEMINI_KEY_COOLDOWN_SECONDS: ${GEMINI_KEY_COOLDOWN_SECONDS:-90}
      GEMINI_KEY_HARD_COOLDOWN_SECONDS: ${GEMINI_KEY_HARD_COOLDOWN_SECONDS:-900}
      GEMINI_BACKOFF_BASE_MS: ${GEMINI_BACKOFF_BASE_MS:-500}
      GEMINI_BACKOFF_MAX_MS: ${GEMINI_BACKOFF_MAX_MS:-10000}
      GEMINI_BACKOFF_JITTER: ${GEMINI_BACKOFF_JITTER:-true}
      GEMINI_FAIL_FAST_SECONDS: ${GEMINI_FAIL_FAST_SECONDS:-30}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_ANALYSIS_MODEL: ${GEMINI_ANALYSIS_MODEL:-gemini-3.1-flash-lite}
      GEMINI_SUMMARY_MODEL: ${GEMINI_SUMMARY_MODEL:-gemini-3.1-flash-lite}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.2}
      GEMINI_CHAT_MAX_OUTPUT_TOKENS: ${GEMINI_CHAT_MAX_OUTPUT_TOKENS:-1200}
      GEMINI_SUMMARY_MAX_OUTPUT_TOKENS: ${GEMINI_SUMMARY_MAX_OUTPUT_TOKENS:-2048}
      GEMINI_STRUCTURED_ANALYSIS_MAX_OUTPUT_TOKENS: ${GEMINI_STRUCTURED_ANALYSIS_MAX_OUTPUT_TOKENS:-4096}
      GEMINI_STUDY_ARTIFACT_MAX_OUTPUT_TOKENS: ${GEMINI_STUDY_ARTIFACT_MAX_OUTPUT_TOKENS:-12288}
      GEMINI_COST_GUARD_ENABLED: ${GEMINI_COST_GUARD_ENABLED:-true}
      GEMINI_COST_GUARD_NAMESPACE: ${GEMINI_COST_GUARD_NAMESPACE:-audiomind-local-cost-test}
      GEMINI_DAILY_REQUEST_LIMIT_PER_USER: ${GEMINI_DAILY_REQUEST_LIMIT_PER_USER:-5}
      GEMINI_DAILY_REANALYZE_LIMIT_PER_MEETING: ${GEMINI_DAILY_REANALYZE_LIMIT_PER_MEETING:-2}
      GEMINI_DAILY_TOKEN_LIMIT_PER_USER: ${GEMINI_DAILY_TOKEN_LIMIT_PER_USER:-30000}
      GEMINI_MAX_CONCURRENT_REQUESTS: ${GEMINI_MAX_CONCURRENT_REQUESTS:-1}
      LOCAL_WHISPER_ENABLED: "false"
      ALLOW_LEGACY_LOCAL_STT: "false"
      OLLAMA_ENABLED: "false"
      ALLOW_LEGACY_LOCAL_AI: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in infra/.env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JOB_STATE_REDIS_URL: redis://redis:6379/2
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_PREFETCH_MULTIPLIER:-1}
      WORKER_HEALTH_PORT: 8080
      AUDIOMIND_USER_API_BASE_URL: http://user-api:8083
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-${GOOGLE_INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in infra/.env}}
      MEETING_SERVICE_BASE_URL: http://meeting-api:8081
      QUOTA_FAIL_OPEN: ${QUOTA_FAIL_OPEN:-false}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-300}
      GEMINI_HTTP_PROXY: ${GEMINI_HTTP_PROXY:-}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://ai-api:8000}
      GEMINI_SHARED_COOLDOWN_ENABLED: ${GEMINI_SHARED_COOLDOWN_ENABLED:-false}
      EPIC3_TRANSCRIPT_QUALITY_ENABLED: ${EPIC3_TRANSCRIPT_QUALITY_ENABLED:-false}
      EPIC3_DOMAIN_LEXICON_ENABLED: ${EPIC3_DOMAIN_LEXICON_ENABLED:-false}
      EPIC3_EVIDENCE_QA_ENABLED: ${EPIC3_EVIDENCE_QA_ENABLED:-false}
      EPIC3_SEARCH_VERIFY_ENABLED: ${EPIC3_SEARCH_VERIFY_ENABLED:-false}
      EPIC3_EXPORT_VERIFY_ENABLED: ${EPIC3_EXPORT_VERIFY_ENABLED:-false}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      ai-db-migrate:
        condition: service_completed_successfully
      ai-api:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - job_status:/app/storage
    healthcheck:
      <<: *http-healthcheck-defaults
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).read()"

  celery-beat:
    <<: *mvp-restart-policy
    build:
      context: ../demoRecordAUDIOMID/ai-service
      args:
        INSTALL_OFFLINE_STT: "false"
    command: sh -c "celery -A app.celery_app.celery_app beat --loglevel=INFO"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_COMPONENT: beat
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JOB_STATE_REDIS_URL: redis://redis:6379/2
      ANALYSIS_BACKGROUND_RETRY_ENABLED: ${ANALYSIS_BACKGROUND_RETRY_ENABLED:-true}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    depends_on:
      redis:
        condition: service_healthy

  processing-api:
    <<: *mvp-restart-policy
    build:
      context: ../demoRecordAUDIOMID
      dockerfile: processing-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -Xmx1024m -Xms512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Xlog:gc*:file=/tmp/gc.log:time,level,tags
      AUDIOMIND_AI_API_BASE_URL: http://ai-api:8000
      AUDIOMIND_MEETING_API_BASE_URL: http://meeting-api:8081
      AUDIOMIND_USER_API_BASE_URL: http://user-api:8083
      INTERNAL_SERVICE_TOKEN: ${GOOGLE_INTERNAL_SERVICE_TOKEN:?Set GOOGLE_INTERNAL_SERVICE_TOKEN in infra/.env}
      GOOGLE_INTERNAL_SERVICE_TOKEN: ${GOOGLE_INTERNAL_SERVICE_TOKEN:?Set GOOGLE_INTERNAL_SERVICE_TOKEN in infra/.env}
      REDIS_HOST: redis
      REDIS_DB: "2"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in infra/.env}
      QUOTA_FAIL_OPEN: ${QUOTA_FAIL_OPEN:-false}
      ERROR_UX_ENABLED: ${ERROR_UX_ENABLED:-true}
      EPIC3_TRANSCRIPT_QUALITY_ENABLED: ${EPIC3_TRANSCRIPT_QUALITY_ENABLED:-false}
      EPIC3_DOMAIN_LEXICON_ENABLED: ${EPIC3_DOMAIN_LEXICON_ENABLED:-false}
      EPIC3_EVIDENCE_QA_ENABLED: ${EPIC3_EVIDENCE_QA_ENABLED:-false}
      EPIC3_SEARCH_VERIFY_ENABLED: ${EPIC3_SEARCH_VERIFY_ENABLED:-false}
      EPIC3_EXPORT_VERIFY_ENABLED: ${EPIC3_EXPORT_VERIFY_ENABLED:-false}
      UPLOAD_VALIDATION_STRICT: ${UPLOAD_VALIDATION_STRICT:-false}
      MIME_SNIFF_ENABLED: ${MIME_SNIFF_ENABLED:-false}
      REALTIME_VALIDATION_ENABLED: ${REALTIME_VALIDATION_ENABLED:-false}
      REALTIME_DUAL_STREAM_TAB_MIC_ENABLED: ${REALTIME_DUAL_STREAM_TAB_MIC_ENABLED:-false}
      REALTIME_ASYNC_AUDIO_QUEUE_ENABLED: ${REALTIME_ASYNC_AUDIO_QUEUE_ENABLED:-true}
      REALTIME_REDIS_STREAMS_ENABLED: ${REALTIME_REDIS_STREAMS_ENABLED:-false}
      HTTP_RATE_LIMIT_ENABLED: ${HTTP_RATE_LIMIT_ENABLED:-true}
      UPLOAD_SECURITY_SCAN_ENABLED: ${UPLOAD_SECURITY_SCAN_ENABLED:-false}
      UPLOAD_SCAN_FAIL_OPEN: ${UPLOAD_SCAN_FAIL_OPEN:-true}
    depends_on:
      redis:
        condition: service_healthy
      user-api:
        condition: service_healthy
      meeting-api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${PROCESSING_API_HOST_PORT:-8082}:8082"
    healthcheck:
      <<: *http-healthcheck-defaults
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/ready"]

  web:
    <<: *mvp-restart-policy
    build:
      context: ..
      dockerfile: FE-Audiomind/Dockerfile
      args:
        VITE_MEETING_API_BASE_URL: ${VITE_MEETING_API_BASE_URL:?Set VITE_MEETING_API_BASE_URL in infra/.env}
        VITE_PROCESSING_API_BASE_URL: ${VITE_PROCESSING_API_BASE_URL:?Set VITE_PROCESSING_API_BASE_URL in infra/.env}
        VITE_USER_API_BASE_URL: ${VITE_USER_API_BASE_URL:?Set VITE_USER_API_BASE_URL in infra/.env}
        VITE_API_BASE: ${VITE_API_BASE:?Set VITE_API_BASE in infra/.env}
        VITE_API_CPU_BASE: ${VITE_API_CPU_BASE:?Set VITE_API_CPU_BASE in infra/.env}
        VITE_API_GPU_BASE: ${VITE_API_GPU_BASE:?Set VITE_API_GPU_BASE in infra/.env}
        VITE_AI_SERVICE_URL: ${VITE_AI_SERVICE_URL:-}
        VITE_REALTIME_WS_ENABLED: ${VITE_REALTIME_WS_ENABLED:-true}
        VITE_REALTIME_WS_BASE_URL: ${VITE_REALTIME_WS_BASE_URL:?Set VITE_REALTIME_WS_BASE_URL in infra/.env}
        VITE_GOOGLE_LOGIN_ENABLED: ${VITE_GOOGLE_LOGIN_ENABLED:-false}
        VITE_PAYOS_ENABLED: ${VITE_PAYOS_ENABLED:-false}
        VITE_REALTIME_ENABLED: ${VITE_REALTIME_ENABLED:-true}
        VITE_REALTIME_DUAL_STREAM_TAB_MIC: ${VITE_REALTIME_DUAL_STREAM_TAB_MIC:-false}
    depends_on:
      user-api:
        condition: service_healthy
      meeting-api:
        condition: service_healthy
      processing-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
