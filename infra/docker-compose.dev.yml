# Shared local infrastructure for AudioMind.
# Layer with docker-compose.mvp.yml for application services.
#
# Local:
#   docker compose --env-file infra/.env -f infra/docker-compose.dev.yml -f infra/docker-compose.mvp.yml up -d
#
# VPS (add prod overlay):
#   docker compose --env-file infra/.env -f infra/docker-compose.dev.yml -f infra/docker-compose.mvp.yml -f infra/docker-compose.prod.yml up -d

name: audiomind-local

services:
  db:
    image: postgres:15.7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audiomind}
      POSTGRES_USER: ${POSTGRES_USER:-audiomind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomind}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.2.5-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # Explicit names isolate Local vs VPS. Override POSTGRES_DATA_VOLUME to reuse data.
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:-audiomind-local_postgres_data}
  uploads:
    name: ${UPLOADS_VOLUME:-audiomind-local_uploads}
  model_cache:
    name: ${MODEL_CACHE_VOLUME:-audiomind-local_model_cache}
  job_status:
    name: ${JOB_STATUS_VOLUME:-audiomind-local_job_status}
  ollama_cache:
    name: ${OLLAMA_CACHE_VOLUME:-audiomind-local_ollama_cache}
