services:
  meeting-api:
    build:
      context: ../demoRecordAUDIOMID
      dockerfile: meeting-service/Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-audiomind}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-audiomind}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-audiomind}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_FLYWAY_ENABLED=false
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080}
      - GOOGLE_USER_SERVICE_URL=http://user-api:8083
      - USER_SERVICE_URL=http://user-api:8083
      - GOOGLE_INTERNAL_SERVICE_TOKEN=${GOOGLE_INTERNAL_SERVICE_TOKEN:-}
      - GOOGLE_CALENDAR_API_BASE_URL=${GOOGLE_CALENDAR_API_BASE_URL:-https://www.googleapis.com/calendar/v3}
    depends_on:
      db:
        condition: service_healthy
      meeting-db-migrate:
        condition: service_completed_successfully
      ai-db-migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
    ports:
      - "8081:8081"

  processing-api:
    build:
      context: ../demoRecordAUDIOMID
      dockerfile: processing-service/Dockerfile
    container_name: processing-api
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx1024m -Xms512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Xlog:gc*:file=/tmp/gc.log:time,level,tags
      - AUDIOMIND_AI_API_BASE_URL=http://ai-api:8000
      - AUDIOMIND_MEETING_API_BASE_URL=http://meeting-api:8081
      - AUDIOMIND_USER_API_BASE_URL=http://user-api:8083
      - INTERNAL_SERVICE_TOKEN=${GOOGLE_INTERNAL_SERVICE_TOKEN:-}
      - GOOGLE_INTERNAL_SERVICE_TOKEN=${GOOGLE_INTERNAL_SERVICE_TOKEN:-}
      - REDIS_HOST=redis
      - REDIS_DB=2
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080}
      - QUOTA_FAIL_OPEN=${QUOTA_FAIL_OPEN:-false}
      - ERROR_UX_ENABLED=${ERROR_UX_ENABLED:-true}
      - EPIC3_TRANSCRIPT_QUALITY_ENABLED=${EPIC3_TRANSCRIPT_QUALITY_ENABLED:-false}
      - EPIC3_DOMAIN_LEXICON_ENABLED=${EPIC3_DOMAIN_LEXICON_ENABLED:-false}
      - EPIC3_EVIDENCE_QA_ENABLED=${EPIC3_EVIDENCE_QA_ENABLED:-false}
      - EPIC3_SEARCH_VERIFY_ENABLED=${EPIC3_SEARCH_VERIFY_ENABLED:-false}
      - EPIC3_EXPORT_VERIFY_ENABLED=${EPIC3_EXPORT_VERIFY_ENABLED:-false}
      - UPLOAD_VALIDATION_STRICT=${UPLOAD_VALIDATION_STRICT:-false}
      - MIME_SNIFF_ENABLED=${MIME_SNIFF_ENABLED:-false}
      - REALTIME_VALIDATION_ENABLED=${REALTIME_VALIDATION_ENABLED:-false}
      - REALTIME_DUAL_STREAM_TAB_MIC_ENABLED=${REALTIME_DUAL_STREAM_TAB_MIC_ENABLED:-false}
      - UPLOAD_SECURITY_SCAN_ENABLED=${UPLOAD_SECURITY_SCAN_ENABLED:-false}
      - UPLOAD_SCAN_FAIL_OPEN=${UPLOAD_SCAN_FAIL_OPEN:-true}
    depends_on:
      meeting-api:
        condition: service_started
      ai-api:
        condition: service_started
    volumes:
      - uploads:/app/uploads
    ports:
      - "8082:8082"

  user-api:
    build:
      context: ../demoRecordAUDIOMID
      dockerfile: user-service/Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-audiomind}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-audiomind}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-audiomind}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_FLYWAY_ENABLED=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=3
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://localhost:3000,http://127.0.0.1:8080,http://localhost:8080}
      - GOOGLE_OAUTH_ENABLED=${GOOGLE_OAUTH_ENABLED:-false}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8083/auth/google/callback}
      - GOOGLE_OAUTH_LINK_REDIRECT_URI=${GOOGLE_OAUTH_LINK_REDIRECT_URI:-http://localhost:8083/auth/google/link/callback}
      - GOOGLE_OAUTH_FRONTEND_BASE_URL=${GOOGLE_OAUTH_FRONTEND_BASE_URL:-http://localhost:8080}
      - GOOGLE_OAUTH_ALLOWED_REDIRECT_ORIGINS=${GOOGLE_OAUTH_ALLOWED_REDIRECT_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      - GOOGLE_TOKEN_ENCRYPTION_KEY=${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      - GOOGLE_TOKEN_ENCRYPTION_KID=${GOOGLE_TOKEN_ENCRYPTION_KID:-v1}
      - GOOGLE_INTERNAL_SERVICE_TOKEN=${GOOGLE_INTERNAL_SERVICE_TOKEN:-}
      - INTERNAL_SERVICE_TOKEN=${GOOGLE_INTERNAL_SERVICE_TOKEN:-}
      - AUDIOMIND_MEETING_API_BASE_URL=http://meeting-api:8081
      - AUDIOMIND_PROCESSING_API_BASE_URL=http://processing-api:8082
      - NOTIFICATION_FRONTEND_BASE_URL=${NOTIFICATION_FRONTEND_BASE_URL:-${PUBLIC_FRONTEND_ORIGIN:-${GOOGLE_OAUTH_FRONTEND_BASE_URL:-http://localhost:8080}}}
      - NOTIFICATION_BRAND_NAME=${NOTIFICATION_BRAND_NAME:-AudioMind}
      - NOTIFICATION_BRAND_ACCENT_COLOR=${NOTIFICATION_BRAND_ACCENT_COLOR:-#5b4bff}
      - PAYOS_ENABLED=${PAYOS_ENABLED:-false}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID:-}
      - PAYOS_API_KEY=${PAYOS_API_KEY:-}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY:-}
      - PAYOS_RETURN_URL=${PAYOS_RETURN_URL:-http://localhost:8080/billing/success}
      - PAYOS_CANCEL_URL=${PAYOS_CANCEL_URL:-http://localhost:8080/billing/cancel}
      - BILLING_PRO_PRICE_VND=${BILLING_PRO_PRICE_VND:-79000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - NOTIFICATION_FROM_EMAIL=${NOTIFICATION_FROM_EMAIL:-noreply@audiomind.local}
      - MANAGEMENT_HEALTH_MAIL_ENABLED=${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      - MEETING_SHARE_NOTIFICATIONS_ENABLED=${MEETING_SHARE_NOTIFICATIONS_ENABLED:-true}
      - GMAIL_SEND_ENABLED=${GMAIL_SEND_ENABLED:-true}
      - ZOOM_OAUTH_ENABLED=${ZOOM_OAUTH_ENABLED:-false}
      - ZOOM_OAUTH_CLIENT_ID=${ZOOM_OAUTH_CLIENT_ID:-}
      - ZOOM_OAUTH_CLIENT_SECRET=${ZOOM_OAUTH_CLIENT_SECRET:-}
      - ZOOM_OAUTH_REDIRECT_URI=${ZOOM_OAUTH_REDIRECT_URI:-http://localhost:8083/auth/zoom/callback}
      - ZOOM_OAUTH_FRONTEND_BASE_URL=${ZOOM_OAUTH_FRONTEND_BASE_URL:-http://localhost:8080}
      - ZOOM_TOKEN_ENCRYPTION_KEY=${ZOOM_TOKEN_ENCRYPTION_KEY:-${GOOGLE_TOKEN_ENCRYPTION_KEY:-}}
      - ZOOM_TOKEN_ENCRYPTION_KID=${ZOOM_TOKEN_ENCRYPTION_KID:-v1}
      - TEAMS_OAUTH_ENABLED=${TEAMS_OAUTH_ENABLED:-false}
      - TEAMS_OAUTH_CLIENT_ID=${TEAMS_OAUTH_CLIENT_ID:-}
      - TEAMS_OAUTH_CLIENT_SECRET=${TEAMS_OAUTH_CLIENT_SECRET:-}
      - TEAMS_OAUTH_REDIRECT_URI=${TEAMS_OAUTH_REDIRECT_URI:-http://localhost:8083/auth/teams/callback}
      - TEAMS_OAUTH_FRONTEND_BASE_URL=${TEAMS_OAUTH_FRONTEND_BASE_URL:-http://localhost:8080}
      - TEAMS_OAUTH_TENANT_ID=${TEAMS_OAUTH_TENANT_ID:-common}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      user-db-migrate:
        condition: service_completed_successfully
      ai-db-migrate:
        condition: service_completed_successfully
    ports:
      - "8083:8083"

  ai-api:
    build:
      context: ../demoRecordAUDIOMID/ai-service
      args:
        INSTALL_OFFLINE_STT: "false"
    container_name: ai-api
    env_file:
      - ../demoRecordAUDIOMID/ai-service/.env
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DEEPGRAM_MODEL=${DEEPGRAM_MODEL:-nova-3}
      - DEEPGRAM_BASE_URL=${DEEPGRAM_BASE_URL:-https://api.deepgram.com/v1/listen}
      - DEEPGRAM_SMART_FORMAT=${DEEPGRAM_SMART_FORMAT:-true}
      - DEEPGRAM_UTTERANCES=${DEEPGRAM_UTTERANCES:-true}
      - DEEPGRAM_PARAGRAPHS=${DEEPGRAM_PARAGRAPHS:-true}
      # Diagnostic only; keep false for normal dev/prod behavior.
      - DEEPGRAM_SIMPLIFY_STREAMING_URL=${DEEPGRAM_SIMPLIFY_STREAMING_URL:-false}
      # Diagnostic only; logs capped raw Deepgram text frames when true.
      - DEEPGRAM_DEBUG_RAW_MESSAGES=${DEEPGRAM_DEBUG_RAW_MESSAGES:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-audiomind}:${POSTGRES_PASSWORD:-audiomind}@db:5432/${POSTGRES_DB:-audiomind}
      - STT_PROVIDER=${STT_PROVIDER:-deepgram}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - DEEPGRAM_REALTIME_MODEL=${DEEPGRAM_REALTIME_MODEL:-nova-3}
      - DEEPGRAM_BATCH_MODEL=${DEEPGRAM_BATCH_MODEL:-nova-3}
      - DEEPGRAM_LANGUAGE=${DEEPGRAM_LANGUAGE:-vi}
      - DEEPGRAM_REALTIME_ENDPOINTING_DEFAULT=${DEEPGRAM_REALTIME_ENDPOINTING_DEFAULT:-}
      - DEEPGRAM_REALTIME_ENDPOINTING_VI=${DEEPGRAM_REALTIME_ENDPOINTING_VI:-}
      - DEEPGRAM_REALTIME_ENDPOINTING_EN=${DEEPGRAM_REALTIME_ENDPOINTING_EN:-}
      - DEEPGRAM_REALTIME_ENDPOINTING_MULTI=${DEEPGRAM_REALTIME_ENDPOINTING_MULTI:-}
      - DEEPGRAM_ENDPOINTING=${DEEPGRAM_ENDPOINTING:-}
      - ENABLE_SPEAKER_DIARIZATION=${ENABLE_SPEAKER_DIARIZATION:-true}
      - DEEPGRAM_DIARIZE=${DEEPGRAM_DIARIZE:-true}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - ANALYSIS_PROVIDER=${ANALYSIS_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - GEMINI_MULTI_KEY_ENABLED=${GEMINI_MULTI_KEY_ENABLED:-false}
      - GEMINI_MAX_ATTEMPTS=${GEMINI_MAX_ATTEMPTS:-3}
      - GEMINI_KEY_COOLDOWN_SECONDS=${GEMINI_KEY_COOLDOWN_SECONDS:-90}
      - GEMINI_KEY_HARD_COOLDOWN_SECONDS=${GEMINI_KEY_HARD_COOLDOWN_SECONDS:-900}
      - GEMINI_BACKOFF_BASE_MS=${GEMINI_BACKOFF_BASE_MS:-500}
      - GEMINI_BACKOFF_MAX_MS=${GEMINI_BACKOFF_MAX_MS:-10000}
      - GEMINI_BACKOFF_JITTER=${GEMINI_BACKOFF_JITTER:-true}
      - GEMINI_FAIL_FAST_SECONDS=${GEMINI_FAIL_FAST_SECONDS:-30}
      - GEMINI_ANALYSIS_MODEL=${GEMINI_ANALYSIS_MODEL:-gemini-2.5-flash}
      - GEMINI_SUMMARY_MODEL=${GEMINI_SUMMARY_MODEL:-gemini-2.5-flash}
      - LOCAL_WHISPER_ENABLED=${LOCAL_WHISPER_ENABLED:-false}
      - ALLOW_LEGACY_LOCAL_STT=${ALLOW_LEGACY_LOCAL_STT:-false}
      - ALLOW_LEGACY_LOCAL_AI=${ALLOW_LEGACY_LOCAL_AI:-false}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama-service:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - JOB_STATE_REDIS_URL=redis://redis:6379/2
      - STT_ENABLE_DISTRIBUTED_OWNERSHIP=${STT_ENABLE_DISTRIBUTED_OWNERSHIP:-true}
      - STT_OWNERSHIP_ENABLED=${STT_OWNERSHIP_ENABLED:-true}
      - STT_OWNERSHIP_REDIS_URL=${STT_OWNERSHIP_REDIS_URL:-redis://redis:6379/2}
      - STT_REPLICA_ID=${STT_REPLICA_ID:-}
      - STT_OWNERSHIP_LEASE_TTL_SECONDS=${STT_OWNERSHIP_LEASE_TTL_SECONDS:-30}
      - STT_OWNERSHIP_COOLDOWN_TTL_SECONDS=${STT_OWNERSHIP_COOLDOWN_TTL_SECONDS:-300}
      - AUDIOMIND_USER_API_BASE_URL=http://user-api:8083
      - INTERNAL_SERVICE_TOKEN=${GOOGLE_INTERNAL_SERVICE_TOKEN:-}
      - QUOTA_FAIL_OPEN=${QUOTA_FAIL_OPEN:-false}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-300}
      - GEMINI_HTTP_PROXY=${GEMINI_HTTP_PROXY:-}
      - INTERNAL_API_BASE_URL=${INTERNAL_API_BASE_URL:-http://ai-api:8000}
      - EPIC3_TRANSCRIPT_QUALITY_ENABLED=${EPIC3_TRANSCRIPT_QUALITY_ENABLED:-false}
      - EPIC3_DOMAIN_LEXICON_ENABLED=${EPIC3_DOMAIN_LEXICON_ENABLED:-false}
      - EPIC3_EVIDENCE_QA_ENABLED=${EPIC3_EVIDENCE_QA_ENABLED:-false}
      - EPIC3_SEARCH_VERIFY_ENABLED=${EPIC3_SEARCH_VERIFY_ENABLED:-false}
      - EPIC3_EXPORT_VERIFY_ENABLED=${EPIC3_EXPORT_VERIFY_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ai-db-migrate:
        condition: service_completed_successfully
    volumes:
      - model_cache:/app/models
      - uploads:/app/uploads
      - job_status:/app/storage
    ports:
      - "8000:8000"

  # Single celery-beat instance dispatches analysis.retry_scheduled every 60s.
  # Do not run a separate worker-loop scheduler alongside beat.
  celery-beat:
    build:
      context: ../demoRecordAUDIOMID/ai-service
      args:
        INSTALL_OFFLINE_STT: "false"
    container_name: celery-beat
    command: sh -c "celery -A app.celery_app.celery_app beat --loglevel=INFO"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-audiomind}:${POSTGRES_PASSWORD:-audiomind}@db:5432/${POSTGRES_DB:-audiomind}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - JOB_STATE_REDIS_URL=redis://redis:6379/2
      - ANALYSIS_BACKGROUND_RETRY_ENABLED=${ANALYSIS_BACKGROUND_RETRY_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ai-db-migrate:
        condition: service_completed_successfully
      ai-api:
        condition: service_started
    volumes:
      - job_status:/app/storage

  celery-worker:
    build:
      context: ../demoRecordAUDIOMID/ai-service
      args:
        INSTALL_OFFLINE_STT: "false"
    container_name: celery-worker
    command: sh -c "celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-4} --prefetch-multiplier=${CELERY_PREFETCH_MULTIPLIER:-1}"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-audiomind}:${POSTGRES_PASSWORD:-audiomind}@db:5432/${POSTGRES_DB:-audiomind}
      - STT_PROVIDER=${STT_PROVIDER:-deepgram}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - DEEPGRAM_MODEL=${DEEPGRAM_MODEL:-nova-3}
      - DEEPGRAM_REALTIME_MODEL=${DEEPGRAM_REALTIME_MODEL:-nova-3}
      - DEEPGRAM_BATCH_MODEL=${DEEPGRAM_BATCH_MODEL:-nova-3}
      - DEEPGRAM_LANGUAGE=${DEEPGRAM_LANGUAGE:-vi}
      - DEEPGRAM_BASE_URL=${DEEPGRAM_BASE_URL:-https://api.deepgram.com/v1/listen}
      - DEEPGRAM_SMART_FORMAT=${DEEPGRAM_SMART_FORMAT:-true}
      - DEEPGRAM_UTTERANCES=${DEEPGRAM_UTTERANCES:-true}
      - DEEPGRAM_PARAGRAPHS=${DEEPGRAM_PARAGRAPHS:-true}
      - ENABLE_SPEAKER_DIARIZATION=${ENABLE_SPEAKER_DIARIZATION:-true}
      - DEEPGRAM_DIARIZE=${DEEPGRAM_DIARIZE:-true}
      - LOCAL_WHISPER_ENABLED=${LOCAL_WHISPER_ENABLED:-false}
      - ALLOW_LEGACY_LOCAL_STT=${ALLOW_LEGACY_LOCAL_STT:-false}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - ANALYSIS_PROVIDER=${ANALYSIS_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - GEMINI_MULTI_KEY_ENABLED=${GEMINI_MULTI_KEY_ENABLED:-false}
      - GEMINI_MAX_ATTEMPTS=${GEMINI_MAX_ATTEMPTS:-3}
      - GEMINI_KEY_COOLDOWN_SECONDS=${GEMINI_KEY_COOLDOWN_SECONDS:-90}
      - GEMINI_KEY_HARD_COOLDOWN_SECONDS=${GEMINI_KEY_HARD_COOLDOWN_SECONDS:-900}
      - GEMINI_BACKOFF_BASE_MS=${GEMINI_BACKOFF_BASE_MS:-500}
      - GEMINI_BACKOFF_MAX_MS=${GEMINI_BACKOFF_MAX_MS:-10000}
      - GEMINI_BACKOFF_JITTER=${GEMINI_BACKOFF_JITTER:-true}
      - GEMINI_FAIL_FAST_SECONDS=${GEMINI_FAIL_FAST_SECONDS:-30}
      - GEMINI_ANALYSIS_MODEL=${GEMINI_ANALYSIS_MODEL:-gemini-2.5-flash}
      - GEMINI_SUMMARY_MODEL=${GEMINI_SUMMARY_MODEL:-gemini-2.5-flash}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      - ALLOW_LEGACY_LOCAL_AI=${ALLOW_LEGACY_LOCAL_AI:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama-service:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - JOB_STATE_REDIS_URL=redis://redis:6379/2
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
      - CELERY_PREFETCH_MULTIPLIER=${CELERY_PREFETCH_MULTIPLIER:-1}
      - WORKER_HEALTH_PORT=8080
      - AUDIOMIND_USER_API_BASE_URL=http://user-api:8083
      - INTERNAL_SERVICE_TOKEN=${GOOGLE_INTERNAL_SERVICE_TOKEN:-}
      - QUOTA_FAIL_OPEN=${QUOTA_FAIL_OPEN:-false}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-300}
      - GEMINI_HTTP_PROXY=${GEMINI_HTTP_PROXY:-}
      - INTERNAL_API_BASE_URL=${INTERNAL_API_BASE_URL:-http://ai-api:8000}
      - EPIC3_TRANSCRIPT_QUALITY_ENABLED=${EPIC3_TRANSCRIPT_QUALITY_ENABLED:-false}
      - EPIC3_DOMAIN_LEXICON_ENABLED=${EPIC3_DOMAIN_LEXICON_ENABLED:-false}
      - EPIC3_EVIDENCE_QA_ENABLED=${EPIC3_EVIDENCE_QA_ENABLED:-false}
      - EPIC3_SEARCH_VERIFY_ENABLED=${EPIC3_SEARCH_VERIFY_ENABLED:-false}
      - EPIC3_EXPORT_VERIFY_ENABLED=${EPIC3_EXPORT_VERIFY_ENABLED:-false}
    depends_on:
      ai-api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ai-db-migrate:
        condition: service_completed_successfully
    volumes:
      - model_cache:/app/models
      - uploads:/app/uploads
      - job_status:/app/storage
    ports:
      - "8088:8080"

  whisper-service:
    profiles: ["legacy-offline"]
    build: ../demoRecordAUDIOMID/whisper-service
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - model_cache:/app/models
      - uploads:/app/uploads
    ports:
      - "8011:8011"

  diarization-service:
    profiles: ["legacy-offline"]
    build: ../demoRecordAUDIOMID/diarization-service
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
    volumes:
      - model_cache:/app/models
      - uploads:/app/uploads
    ports:
      - "8012:8012"

  ollama-service:
    profiles: ["legacy-offline"]
    image: ollama/ollama:0.5.1
    container_name: ollama-service
    volumes:
      - ollama_cache:/root/.ollama
    ports:
      - "11434:11434"
    command: ["serve"]

  processing-service:
    profiles: ["legacy-offline"]
    build: ../demoRecordAUDIOMID/ai-processing-service
    depends_on:
      - whisper-service
      - diarization-service
      - ollama-service
    environment:
      - WHISPER_SERVICE_URL=http://whisper-service:8011
      - DIARIZATION_SERVICE_URL=http://diarization-service:8012
      - OLLAMA_BASE_URL=http://ollama-service:11434
      - OLLAMA_MODEL=qwen2.5:3b
    volumes:
      - uploads:/app/uploads
    ports:
      - "8010:8010"

  web:
    build:
      context: ..
      dockerfile: FE-Audiomind/Dockerfile
      args:
        VITE_MEETING_API_BASE_URL: http://localhost:8081
        VITE_PROCESSING_API_BASE_URL: http://localhost:8082
        VITE_USER_API_BASE_URL: http://localhost:8083
        VITE_API_BASE: http://localhost:8082
        VITE_API_CPU_BASE: http://localhost:8000
        VITE_API_GPU_BASE: http://localhost:8001
        VITE_AI_SERVICE_URL: http://localhost:8000
        VITE_REALTIME_WS_ENABLED: "true"
        VITE_REALTIME_WS_BASE_URL: ws://localhost:8082/ws/meetings
        VITE_GOOGLE_LOGIN_ENABLED: ${VITE_GOOGLE_LOGIN_ENABLED:-false}
        VITE_PAYOS_ENABLED: ${VITE_PAYOS_ENABLED:-false}
        VITE_REALTIME_ENABLED: ${VITE_REALTIME_ENABLED:-true}
        VITE_REALTIME_DUAL_STREAM_TAB_MIC: ${VITE_REALTIME_DUAL_STREAM_TAB_MIC:-false}
    ports:
      - "8080:80"

  db:
    image: postgres:15.7
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-audiomind}
      - POSTGRES_USER=${POSTGRES_USER:-audiomind}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-audiomind}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  meeting-db-migrate:
    build:
      context: ../demoRecordAUDIOMID/meeting-service/src/main/resources/db/migration
      dockerfile: ../../../../../../../infra/docker/flyway/Dockerfile
    command:
      - -connectRetries=30
      - migrate
    restart: "no"
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-audiomind}
      - FLYWAY_USER=${POSTGRES_USER:-audiomind}
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD:-audiomind}
      - FLYWAY_TABLE=flyway_schema_history_meeting
      - FLYWAY_LOCATIONS=filesystem:/flyway/sql
    depends_on:
      db:
        condition: service_healthy

  user-db-migrate:
    build:
      context: ../demoRecordAUDIOMID/user-service/src/main/resources/db/migration
      dockerfile: ../../../../../../../infra/docker/flyway/Dockerfile
    command:
      - -connectRetries=30
      - migrate
    restart: "no"
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-audiomind}
      - FLYWAY_USER=${POSTGRES_USER:-audiomind}
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD:-audiomind}
      - FLYWAY_TABLE=flyway_schema_history_user
      - FLYWAY_LOCATIONS=filesystem:/flyway/sql
    depends_on:
      meeting-db-migrate:
        condition: service_completed_successfully

  ai-db-migrate:
    build:
      context: ../demoRecordAUDIOMID/ai-service
      args:
        INSTALL_OFFLINE_STT: "false"
    command:
      - alembic
      - upgrade
      - head
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-audiomind}:${POSTGRES_PASSWORD:-audiomind}@db:5432/${POSTGRES_DB:-audiomind}
    depends_on:
      user-db-migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7.2.5-alpine
    ports:
      - "6379:6379"

volumes:
  model_cache:
  uploads:
  job_status:
  ollama_cache:
  postgres_data:
