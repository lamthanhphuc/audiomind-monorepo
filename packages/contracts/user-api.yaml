openapi: 3.0.3
info:
  title: User API
  version: 0.1.0
  description: Auth, billing, notifications, Google OAuth integration (user-service).
paths:
  /health:
    get:
      summary: Health check
      operationId: userHealth
      responses:
        "200":
          description: OK
  /ready:
    get:
      summary: Readiness check
      operationId: userReady
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /api/users/register:
    post:
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
  /api/users/login:
    post:
      summary: Login with username and password
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Auth tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/users/logout:
    post:
      summary: Logout current session
      operationId: logoutUser
      responses:
        "200":
          description: Logged out
  /api/users/refresh-token:
    post:
      summary: Refresh JWT access token
      operationId: refreshUserToken
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/users/me:
    get:
      summary: Current user profile
      operationId: getCurrentUser
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
  /api/users/me/preferences:
    patch:
      summary: Update user preferences
      operationId: updateUserPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domainMode:
                  type: string
                  enum: [general, it, business, education]
                domain_mode:
                  type: string
                  enum: [general, it, business, education]
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  domainMode:
                    type: string
  /api/users/me/jobs:
    get:
      summary: Aggregated jobs from processing and meeting services
      operationId: getMyJobs
      responses:
        "200":
          description: Job summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/users/me/notifications:
    get:
      summary: List notifications
      operationId: listNotifications
      parameters:
        - in: query
          name: unreadOnly
          schema:
            type: boolean
            default: false
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
  /api/users/me/notifications/unread-count:
    get:
      summary: Unread notification count
      operationId: getUnreadNotificationCount
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount:
                    type: integer
  /api/users/me/notifications/{id}/read:
    patch:
      summary: Mark notification read
      operationId: markNotificationRead
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Updated notification
  /api/users/me/notifications/read-all:
    post:
      summary: Mark all notifications read
      operationId: markAllNotificationsRead
      responses:
        "200":
          description: Bulk update result
  /api/users/me/knowledge-notes:
    get:
      summary: List knowledge notes
      operationId: listKnowledgeNotes
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: meetingId
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Knowledge notes
    post:
      summary: Create knowledge note
      operationId: createKnowledgeNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Created note
  /api/users/me/speaker-memory:
    get:
      summary: List speaker memory entries
      operationId: listSpeakerMemory
      responses:
        "200":
          description: Speaker memory list
  /api/users/me/speaker-memory/suggest:
    get:
      summary: Suggest speaker display name
      operationId: suggestSpeakerDisplayName
      parameters:
        - in: query
          name: speakerKey
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Suggestion result
  /auth/zoom/link/start:
    post:
      summary: Start Zoom account linking
      operationId: startZoomLink
      responses:
        "200":
          description: Authorization URI
  /auth/zoom/callback:
    get:
      summary: Zoom OAuth callback
      operationId: zoomOAuthCallback
      responses:
        "302":
          description: Redirect to frontend
  /users/me/zoom/status:
    get:
      summary: Zoom link status
      operationId: getZoomStatus
      responses:
        "200":
          description: Zoom status
  /users/me/zoom/recordings:
    get:
      summary: List Zoom cloud recordings
      operationId: listZoomRecordings
      responses:
        "200":
          description: Recording list
  /users/me/zoom/recordings/import:
    post:
      summary: Import Zoom cloud recording into meeting pipeline
      operationId: importZoomRecording
      responses:
        "200":
          description: Import result
  /auth/teams/link/start:
    post:
      summary: Start Microsoft Teams OAuth (scaffold)
      operationId: startTeamsLink
      responses:
        "200":
          description: Authorization URI
  /auth/teams/callback:
    get:
      summary: Teams OAuth callback (scaffold)
      operationId: teamsOAuthCallback
      responses:
        "302":
          description: Redirect to frontend
  /api/billing/me:
    get:
      summary: Billing overview with quota and invoices
      operationId: getBillingOverview
      responses:
        "200":
          description: Billing overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingOverview"
  /api/billing/checkout/pro:
    post:
      summary: Create PayOS Pro checkout
      operationId: checkoutProPlan
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
  /api/billing/orders/{orderCode}:
    get:
      summary: Get order status
      operationId: getBillingOrderStatus
      parameters:
        - in: path
          name: orderCode
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusResponse"
  /auth/google/start:
    get:
      summary: Start Google OAuth login redirect
      operationId: startGoogleLogin
      parameters:
        - in: query
          name: redirect_after
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to Google
  /auth/google/link/start:
    post:
      summary: Start Google account link flow
      operationId: startGoogleLink
      responses:
        "200":
          description: Authorization URL
  /auth/google/status:
    get:
      summary: Google integration status for current user
      operationId: getGoogleIntegrationStatus
      responses:
        "200":
          description: Linked status and scopes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleIntegrationStatus"
  /internal/quota/consume:
    post:
      summary: Consume quota (internal, idempotent)
      operationId: consumeInternalQuota
      description: >
        Service-to-service quota charge. Returns tri-state status ALLOWED | DENIED | UNKNOWN.
        Same idempotencyKey returns the prior ledger outcome without double-charging.
      parameters:
        - in: header
          name: X-Internal-Service-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaConsumeRequest"
      responses:
        "200":
          description: Quota decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaConsumeResponse"
        "401":
          description: Invalid or missing internal token
        "503":
          description: Internal token not configured
components:
  schemas:
    QuotaConsumeRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
        sttSecondsDelta:
          type: integer
          format: int64
          minimum: 0
        geminiCharsDelta:
          type: integer
          format: int64
          minimum: 0
        idempotencyKey:
          type: string
          nullable: true
        quotaType:
          type: string
          nullable: true
          enum:
            - SUBJECT_SYNTHESIS
            - STUDY_ARTIFACT
            - STT
            - GEMINI
    QuotaConsumeResponse:
      type: object
      required:
        - allowed
        - status
      properties:
        allowed:
          type: boolean
        status:
          type: string
          enum:
            - ALLOWED
            - DENIED
            - UNKNOWN
        periodYyyymm:
          type: string
        sttSecondsUsed:
          type: integer
          format: int64
        geminiInputCharsUsed:
          type: integer
          format: int64
        sttSecondsLimit:
          type: integer
          format: int64
        geminiInputCharsLimit:
          type: integer
          format: int64
        idempotencyKey:
          type: string
          nullable: true
        quotaType:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
        retryable:
          type: boolean
    RegisterRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
    RegisterResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
        user:
          $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        plan:
          type: string
        role:
          type: string
    UserProfileResponse:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string
        email:
          type: string
        domainMode:
          type: string
          enum: [general, it, business, education]
    NotificationListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        unreadCount:
          type: integer
    BillingOverview:
      type: object
      properties:
        userId:
          type: integer
        plan:
          type: string
        quota:
          type: object
          additionalProperties: true
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/BillingInvoice"
    BillingInvoice:
      type: object
      properties:
        orderCode:
          type: integer
        status:
          type: string
        amountVnd:
          type: integer
        checkoutUrl:
          type: string
          nullable: true
    CheckoutResponse:
      type: object
      properties:
        orderCode:
          type: integer
        checkoutUrl:
          type: string
          nullable: true
        status:
          type: string
    OrderStatusResponse:
      type: object
      properties:
        orderCode:
          type: integer
        status:
          type: string
        amountVnd:
          type: integer
    GoogleIntegrationStatus:
      type: object
      properties:
        linked:
          type: boolean
        googleEmail:
          type: string
          nullable: true
        grantedScopes:
          type: array
          items:
            type: string
        missingScopes:
          type: array
          items:
            type: string
