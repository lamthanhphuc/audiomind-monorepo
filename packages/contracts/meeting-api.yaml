openapi: 3.0.3
info:
  title: Meeting API
  version: 0.1.0
paths:
  /api/v1/meetings:
    post:
      summary: Create meeting
      operationId: createMeeting
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /api/v1/meetings/{id}:
    get:
      summary: Get meeting
      operationId: getMeeting
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /api/v1/meetings/{id}/result:
    put:
      summary: Update meeting result
      operationId: updateMeetingResult
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingResultUpdate"
      responses:
        "200":
          description: Updated meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /api/v1/meetings/scheduled:
    post:
      summary: Create scheduled meeting for Google Calendar linking
      operationId: createScheduledMeeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledMeetingCreate"
      responses:
        "200":
          description: Scheduled meeting created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledMeeting"
  /api/v1/meetings/{id}/google/calendar-event:
    post:
      summary: Create Google Calendar event for meeting
      operationId: createGoogleCalendarEvent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCalendarEventCreate"
      responses:
        "200":
          description: Calendar link status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCalendarStatus"
        "202":
          description: Calendar event creation in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCalendarStatus"
  /api/v1/meetings/{id}/google/status:
    get:
      summary: Poll Google Calendar creation status
      operationId: getGoogleCalendarStatus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Current Google Calendar status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCalendarStatus"
        "202":
          description: Calendar event still being created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCalendarStatus"
  /api/v1/meetings/google/calendars:
    get:
      summary: List Google calendars for linked account
      operationId: listGoogleCalendars
      responses:
        "200":
          description: Calendar list payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/meetings/google/meet:
    post:
      summary: Create quick Google Meet
      operationId: createQuickGoogleMeet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
      responses:
        "200":
          description: Meet link created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /meetings/{meetingId}/speakers:
    get:
      summary: List speaker display profiles
      operationId: listMeetingSpeakerProfiles
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Speaker profiles
    put:
      summary: Upsert speaker display profiles
      operationId: upsertMeetingSpeakerProfiles
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profiles:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        "200":
          description: Updated profiles
  /meetings/{meetingId}/tasks:
    get:
      summary: List meeting tasks
      operationId: listMeetingTasks
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Task list
    post:
      summary: Create meeting task
      operationId: createMeetingTask
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Created task
  /study-folders:
    post:
      summary: Create study folder
      operationId: createStudyFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyFolderRequest"
      responses:
        "200":
          description: Created folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyFolderResponse"
    get:
      summary: List study folders
      operationId: listStudyFolders
      responses:
        "200":
          description: Folder list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyFolderResponse"
  /study-folders/tree:
    get:
      summary: Get study folder tree with subjects
      operationId: getStudyFolderTree
      responses:
        "200":
          description: Folder tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyFolderTreeResponse"
  /study-folders/{folderId}:
    get:
      summary: Get study folder by id
      operationId: getStudyFolder
      parameters:
        - in: path
          name: folderId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyFolderResponse"
    patch:
      summary: Update study folder
      operationId: updateStudyFolder
      parameters:
        - in: path
          name: folderId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudyFolderRequest"
      responses:
        "200":
          description: Updated folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyFolderResponse"
    delete:
      summary: Delete study folder
      operationId: deleteStudyFolder
      parameters:
        - in: path
          name: folderId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Deleted folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyFolderResponse"
  /subjects:
    post:
      summary: Create subject
      operationId: createSubject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubjectRequest"
      responses:
        "200":
          description: Created subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectResponse"
    get:
      summary: List subjects
      operationId: listSubjects
      parameters:
        - in: query
          name: folderId
          schema:
            type: integer
            format: int64
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: archived
          schema:
            type: boolean
            default: false
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
        - in: query
          name: sort
          schema:
            type: string
            default: name_asc
      responses:
        "200":
          description: Subject page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectPageResponse"
  /subjects/{subjectId}:
    get:
      summary: Get subject detail
      operationId: getSubject
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectDetailResponse"
    patch:
      summary: Update subject
      operationId: updateSubject
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubjectRequest"
      responses:
        "200":
          description: Updated subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectResponse"
    delete:
      summary: Archive subject
      operationId: archiveSubject
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Archived subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectResponse"
  /subjects/{subjectId}/meetings:
    get:
      summary: List meetings for subject
      operationId: listSubjectMeetings
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Subject meetings page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectMeetingPageResponse"
  /meetings/realtime:
    post:
      summary: Create realtime meeting
      operationId: createRealtimeMeeting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRealtimeMeetingRequest"
      responses:
        "200":
          description: Created realtime meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingUploadResponse"
  /meetings/upload:
    post:
      summary: Upload meeting audio
      operationId: uploadMeeting
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - file
              properties:
                title:
                  type: string
                file:
                  type: string
                  format: binary
                language:
                  type: string
                subjectId:
                  type: string
      responses:
        "200":
          description: Uploaded meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingUploadResponse"
  /meetings/unclassified:
    get:
      summary: List unclassified meetings
      operationId: listUnclassifiedMeetings
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            default: createdAt_desc
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Unclassified meetings page (Map wrapper equivalent to PageResponse)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingPageResponse"
  /meetings/{meetingId}/subject:
    patch:
      summary: Assign or remove meeting subject
      operationId: assignMeetingSubject
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignMeetingSubjectRequest"
      responses:
        "200":
          description: Updated meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingEntity"
  /internal/subjects/{subjectId}/meetings:
    get:
      summary: Internal subject membership page (service-to-service)
      operationId: listInternalSubjectMeetings
      description: >
        Authenticated with X-Internal-Service-Token and scoped by X-Owner-User-Id.
        Used by AI study workers; does not accept user JWT.
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - in: header
          name: X-Internal-Service-Token
          required: true
          schema:
            type: string
        - in: header
          name: X-Owner-User-Id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Paged subject meetings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectMeetingPageResponse"
        "400":
          description: Missing or invalid owner header
        "401":
          description: Invalid or missing internal token
        "404":
          description: Subject not found for owner
        "503":
          description: Internal token not configured
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /ready:
    get:
      summary: Readiness check
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
components:
  schemas:
    Meeting:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
        transcript:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
    ScheduledMeetingCreate:
      type: object
      required:
        - title
        - startDateTime
        - endDateTime
        - timeZone
      properties:
        title:
          type: string
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        timeZone:
          type: string
        language:
          type: string
    ScheduledMeeting:
      type: object
      required:
        - id
        - title
        - status
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          type: string
        scheduledStartAt:
          type: string
          format: date-time
        scheduledEndAt:
          type: string
          format: date-time
        scheduledTimezone:
          type: string
    GoogleCalendarEventCreate:
      type: object
      required:
        - startDateTime
        - endDateTime
        - timeZone
      properties:
        startDateTime:
          type: string
        endDateTime:
          type: string
        timeZone:
          type: string
        attendees:
          type: array
          items:
            type: string
    GoogleCalendarStatus:
      type: object
      required:
        - meetingId
        - creationStatus
        - conferenceStatus
      properties:
        meetingId:
          type: integer
          format: int64
        creationStatus:
          type: string
          enum:
            - not_created
            - creating
            - success
            - failed
        conferenceStatus:
          type: string
        googleCalendarEventId:
          type: string
          nullable: true
        meetUri:
          type: string
          nullable: true
        hangoutLink:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
    MeetingResultUpdate:
      type: object
      required:
        - transcript
        - summary
      properties:
        transcript:
          type: string
        summary:
          type: string
    CreateStudyFolderRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        color:
          type: string
          nullable: true
        parentFolderId:
          type: integer
          format: int64
          nullable: true
    UpdateStudyFolderRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
          nullable: true
        parentFolderId:
          type: integer
          format: int64
          nullable: true
    StudyFolderResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        ownerUserId:
          type: integer
          format: int64
        parentFolderId:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        color:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        subjectCount:
          type: integer
          format: int64
    SubjectSummaryResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        code:
          type: string
          nullable: true
        semester:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        folderId:
          type: integer
          format: int64
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true
        meetingCount:
          type: integer
          format: int64
    StudyFolderTreeNode:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
          nullable: true
        parentFolderId:
          type: integer
          format: int64
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/StudyFolderTreeNode"
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/SubjectSummaryResponse"
    StudyFolderTreeResponse:
      type: object
      properties:
        folders:
          type: array
          items:
            $ref: "#/components/schemas/StudyFolderTreeNode"
        rootSubjects:
          type: array
          items:
            $ref: "#/components/schemas/SubjectSummaryResponse"
    CreateSubjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        code:
          type: string
          nullable: true
        semester:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        folderId:
          type: integer
          format: int64
          nullable: true
    UpdateSubjectRequest:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
          nullable: true
        semester:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        folderId:
          type: integer
          format: int64
          nullable: true
    SubjectResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        ownerUserId:
          type: integer
          format: int64
        folderId:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        code:
          type: string
          nullable: true
        semester:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
        meetingCount:
          type: integer
          format: int64
    SubjectDetailResponse:
      type: object
      required:
        - subject
      properties:
        subject:
          $ref: "#/components/schemas/SubjectResponse"
    SubjectMeetingResponse:
      type: object
      required:
        - id
        - title
        - status
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          type: string
        language:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        subjectId:
          type: integer
          format: int64
          nullable: true
    PageMeta:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
    SubjectPageResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubjectResponse"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
    SubjectMeetingPageResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubjectMeetingResponse"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
    MeetingEntity:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        audioPath:
          type: string
        originalFileName:
          type: string
          nullable: true
        ownerUserId:
          type: integer
          format: int64
          nullable: true
        subjectId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
        language:
          type: string
          nullable: true
        fileSize:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          nullable: true
        scheduledStartAt:
          type: string
          format: date-time
          nullable: true
        scheduledEndAt:
          type: string
          format: date-time
          nullable: true
        scheduledTimezone:
          type: string
          nullable: true
        sharedWithMe:
          type: boolean
          nullable: true
    MeetingPageResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MeetingEntity"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
    CreateRealtimeMeetingRequest:
      type: object
      properties:
        title:
          type: string
        language:
          type: string
        subjectId:
          type: integer
          format: int64
          nullable: true
    MeetingUploadResponse:
      type: object
      required:
        - id
        - title
        - audioPath
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        audioPath:
          type: string
        createdAt:
          type: string
          format: date-time
        originalFileName:
          type: string
          nullable: true
        ownerUserId:
          type: integer
          format: int64
          nullable: true
        language:
          type: string
          nullable: true
        fileSize:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          nullable: true
        subjectId:
          type: integer
          format: int64
          nullable: true
        duplicate:
          type: boolean
        reused:
          type: boolean
        existingMeetingId:
          type: integer
          format: int64
          nullable: true
        source:
          type: string
    AssignMeetingSubjectRequest:
      type: object
      properties:
        subjectId:
          type: integer
          format: int64
          nullable: true
