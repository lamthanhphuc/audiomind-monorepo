openapi: 3.0.3
info:
  title: AI API
  version: 0.1.0
paths:
  /api/process:
    post:
      summary: Queue processing job in AI service
      operationId: processMeeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessRequestV2"
      responses:
        "200":
          description: Processing request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessResponse"
  /api/upload-audio:
    post:
      summary: Upload audio content for AI processing
      operationId: uploadAudio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded audio metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /api/meeting/{meeting_id}/status:
    get:
      summary: Get job status by meeting id
      operationId: getMeetingStatus
      parameters:
        - in: path
          name: meeting_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Current job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /api/meeting/{meeting_id}/transcript:
    get:
      summary: Get transcript by meeting id
      operationId: getMeetingTranscript
      parameters:
        - in: path
          name: meeting_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Transcript payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptResponse"
  /api/meeting/{meeting_id}/analysis:
    get:
      summary: Get analysis by meeting id
      operationId: getMeetingAnalysis
      parameters:
        - in: path
          name: meeting_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Analysis payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
  /api/config/lexicon:
    get:
      summary: Get domain lexicon pack for transcript highlighting
      operationId: getDomainLexicon
      parameters:
        - in: query
          name: domain
          required: false
          schema:
            type: string
            default: general
      responses:
        "200":
          description: Domain lexicon terms and normalization map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainLexicon"
  /api/v1/process:
    post:
      summary: Process meeting in AI service
      operationId: processMeetingV1
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessRequest"
      responses:
        "200":
          description: Mock processing result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessResult"
  /api/meeting/{meeting_id}/analysis/rerun:
    post:
      summary: Re-run analysis for a meeting
      operationId: rerunMeetingAnalysis
      parameters:
        - in: path
          name: meeting_id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRerunRequest"
      responses:
        "200":
          description: Analysis rerun accepted or completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
  /api/meeting/{meeting_id}/chat:
    post:
      summary: Ask a question about meeting content
      operationId: meetingChat
      parameters:
        - in: path
          name: meeting_id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Chat answer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/meeting/{meeting_id}/terms/explain:
    post:
      summary: Explain a technical term in meeting context
      operationId: explainMeetingTerm
      parameters:
        - in: path
          name: meeting_id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermExplainRequest"
      responses:
        "200":
          description: Term explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermExplainResponse"
  /api/search/semantic-rerank:
    post:
      summary: Semantic rerank of meeting search candidates
      operationId: semanticRerankMeetings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticRerankRequest"
      responses:
        "200":
          description: Ranked candidates
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/search/cross-meeting/ask:
    post:
      summary: Ask a question across multiple meetings
      operationId: crossMeetingAsk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrossMeetingAskRequest"
      responses:
        "200":
          description: Cross-meeting answer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/internal/meetings/{meeting_id}/canonicalize:
    post:
      summary: Queue canonical transcript generation (internal)
      operationId: canonicalizeMeetingTranscript
      parameters:
        - in: path
          name: meeting_id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonicalizeRequest"
      responses:
        "202":
          description: Canonicalize task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalizeResponse"
  /api/internal/meetings/{meeting_id}/transcript-quality:
    get:
      summary: Get transcript quality metadata (internal)
      operationId: getMeetingTranscriptQuality
      parameters:
        - in: path
          name: meeting_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Transcript quality payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptQualityResponse"
  /api/internal/realtime-analysis:
    post:
      summary: Analyze realtime transcript (internal)
      operationId: analyzeRealtimeTranscript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeAnalysisRequest"
      responses:
        "200":
          description: Realtime analysis result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /ready:
    get:
      summary: Readiness check
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /liveness:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Alive
components:
  schemas:
    ProcessRequest:
      type: object
      properties:
        meeting_id:
          type: string
    ProcessRequestV2:
      type: object
      properties:
        meeting_id:
          type: integer
          format: int64
        audio_path:
          type: string
        file_id:
          type: string
        topic:
          type: string
        glossary_terms:
          type: array
          items:
            type: string
        language:
          type: string
    ProcessResponse:
      type: object
      required:
        - meeting_id
        - status
      properties:
        meeting_id:
          type: integer
          format: int64
        status:
          type: string
        message:
          type: string
    ProcessResult:
      type: object
      required:
        - transcript
        - summary
      properties:
        transcript:
          type: string
        summary:
          type: string
    UploadResponse:
      type: object
      required:
        - audio_path
        - original_filename
      properties:
        audio_path:
          type: string
        original_filename:
          type: string
    StatusResponse:
      type: object
      required:
        - jobId
        - status
      properties:
        jobId:
          type: string
        status:
          type: string
        progress:
          type: integer
        stage:
          type: string
        error:
          type: string
          nullable: true
    TranscriptResponse:
      type: object
      required:
        - meeting_id
        - transcripts
      properties:
        meeting_id:
          type: integer
          format: int64
        transcripts:
          type: array
          items:
            type: object
            additionalProperties: true
        transcriptMode:
          type: string
          enum:
            - canonical
            - raw
        canonicalTranscriptVersion:
          type: string
          nullable: true
        canonicalTranscriptHash:
          type: string
          nullable: true
        canonicalGeneratedAt:
          type: string
          format: date-time
          nullable: true
        rawTranscripts:
          type: array
          items:
            type: object
            additionalProperties: true
    AnalysisResponse:
      type: object
      required:
        - meeting_id
      properties:
        meeting_id:
          type: integer
          format: int64
      additionalProperties: true
    DomainLexicon:
      type: object
      required:
        - domain
        - versionHash
        - terms
        - normalizationMap
      properties:
        domain:
          type: string
        versionHash:
          type: string
        terms:
          type: array
          items:
            type: object
            properties:
              term:
                type: string
              normalized:
                type: string
              category:
                type: string
              source:
                type: string
        normalizationMap:
          type: object
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
    AnalysisRerunRequest:
      type: object
      properties:
        mode:
          type: string
        reason:
          type: string
        transcript:
          type: string
        transcript_hash:
          type: string
    TermExplainRequest:
      type: object
      properties:
        term:
          type: string
        summary:
          type: string
        transcript_excerpt:
          type: string
        analysis:
          type: object
          additionalProperties: true
    TermExplainResponse:
      type: object
      properties:
        meetingId:
          type: integer
          format: int64
        term:
          type: string
        explanation:
          type: string
        provider:
          type: string
    SemanticRerankRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
        candidates:
          type: array
          items:
            type: object
            additionalProperties: true
    CrossMeetingAskRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
        meetings:
          type: array
          items:
            type: object
            additionalProperties: true
    CanonicalizeRequest:
      type: object
      properties:
        runId:
          type: integer
          format: int64
        run_id:
          type: integer
          format: int64
        force:
          type: boolean
          default: false
    CanonicalizeResponse:
      type: object
      properties:
        taskId:
          type: string
    TranscriptQualityResponse:
      type: object
      properties:
        meetingId:
          type: integer
          format: int64
        ready:
          type: boolean
      additionalProperties: true
    RealtimeAnalysisRequest:
      type: object
      required:
        - meeting_id
        - transcript
      properties:
        meeting_id:
          type: integer
          format: int64
        transcript:
          type: string
        source:
          type: string
        transcript_hash:
          type: string
        prompt_version:
          type: string
        schema_version:
          type: string
