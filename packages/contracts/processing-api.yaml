openapi: 3.0.3
info:
  title: Processing API
  version: 0.1.0
paths:
  /processing/upload:
    post:
      summary: Upload audio file for processing
      operationId: uploadAudio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /processing/start:
    post:
      summary: Start processing for a meeting
      operationId: startProcessing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessStartRequest"
      parameters:
        - in: query
          name: meetingId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Processing status after enqueue/start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingStartResponse"
  /processing/status/{jobId}:
    get:
      summary: Get processing status by meeting/job identifier
      operationId: getProcessingStatus
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Processing status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingStatusResponse"
  /processing/transcript/{jobId}:
    get:
      summary: Get transcript payload by meeting/job identifier (legacy)
      deprecated: true
      description: Prefer GET /processing/{meetingId}/transcript
      operationId: getProcessingTranscript
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Transcript payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPayload"
  /processing/{meetingId}/analysis:
    get:
      summary: Get analysis payload by meeting identifier
      operationId: getProcessingAnalysis
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Analysis payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisPayload"
  /processing/{meetingId}/transcript/export:
    get:
      summary: Export saved transcript as readable or raw TXT/CSV
      operationId: exportRawTranscript
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: format
          required: true
          schema:
            type: string
            enum:
              - txt
              - csv
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum:
              - readable
              - raw
            default: readable
      responses:
        "200":
          description: Transcript export payload
          content:
            text/plain:
              schema:
                type: string
            text/csv:
              schema:
                type: string
  /processing/{meetingId}/transcript:
    get:
      summary: Get saved transcript by meeting identifier
      operationId: getMeetingTranscript
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Transcript payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPayload"
  /processing/{meetingId}/transcript/search:
    get:
      summary: Search transcript evidence
      operationId: searchMeetingTranscriptEvidence
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
        - in: query
          name: context
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Transcript search response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptSearchResponse"
  /processing/{meetingId}/chat:
    post:
      summary: Ask meeting chatbot with citations
      operationId: askMeetingChat
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
      responses:
        "200":
          description: Chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingChatResponse"
  /processing/search/semantic:
    post:
      summary: Semantic meeting search
      operationId: semanticSearchMeetings
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
      responses:
        "200":
          description: Semantic search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticSearchResponse"
  /processing/cross-meeting/ask:
    post:
      summary: Ask across meetings
      operationId: askCrossMeeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                limit:
                  type: integer
      responses:
        "200":
          description: Cross-meeting answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossMeetingAskResponse"
  /processing/{meetingId}/action-plan:
    get:
      summary: Get grouped action plan preview
      operationId: getMeetingActionPlan
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Action plan preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionPlanResponse"
  /processing/{meetingId}/action-plan/export:
    get:
      summary: Export action plan as DOCX
      operationId: exportMeetingActionPlan
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [docx, pdf]
            default: docx
      responses:
        "200":
          description: Action plan export
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
  /processing/{meetingId}/report:
    get:
      summary: Export meeting report as DOCX or PDF
      operationId: exportMeetingReport
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [docx, pdf]
            default: docx
      responses:
        "200":
          description: Meeting report export
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
  /processing/subjects/{subjectId}/synthesis:
    post:
      summary: Prepare or create subject synthesis job
      operationId: createSubjectSynthesis
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectSynthesisRequest"
      responses:
        "200":
          description: Synthesis job or cache hit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectSynthesisResponse"
    get:
      summary: Get current subject synthesis
      operationId: getSubjectSynthesis
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Current synthesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectSynthesisResponse"
  /processing/subjects/{subjectId}/synthesis/status:
    get:
      summary: Get subject synthesis status
      operationId: getSubjectSynthesisStatus
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Synthesis status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectSynthesisResponse"
  /processing/subjects/{subjectId}/synthesis/regenerate:
    post:
      summary: Force regenerate subject synthesis
      operationId: regenerateSubjectSynthesis
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectSynthesisRequest"
      responses:
        "200":
          description: New synthesis version queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectSynthesisResponse"
  /processing/study-artifacts:
    post:
      summary: Prepare or create study artifacts
      operationId: createStudyArtifacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyArtifactsRequest"
      responses:
        "200":
          description: Artifact prepare response with ids and statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyArtifactsResponse"
  /processing/study-artifacts/{artifactId}:
    get:
      summary: Get study artifact by id
      operationId: getStudyArtifact
      parameters:
        - in: path
          name: artifactId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Study artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyArtifactResponse"
    delete:
      summary: Soft-delete study artifact
      operationId: deleteStudyArtifact
      parameters:
        - in: path
          name: artifactId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /processing/study-artifacts/{artifactId}/regenerate:
    post:
      summary: Force regenerate one study artifact
      operationId: regenerateStudyArtifact
      parameters:
        - in: path
          name: artifactId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Regenerated artifact batch response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyArtifactsResponse"
  /processing/subjects/{subjectId}/study-artifacts:
    get:
      summary: List study artifacts for a subject
      operationId: listSubjectStudyArtifacts
      parameters:
        - in: path
          name: subjectId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: artifactType
          schema:
            $ref: "#/components/schemas/StudyArtifactType"
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Artifact list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyArtifactsListResponse"
  /api/config/transcript-quality:
    get:
      summary: Get transcript quality policy (Epic 3)
      operationId: getTranscriptQualityPolicy
      responses:
        "200":
          description: Transcript quality policy JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/jobs:
    post:
      summary: Create processing job
      operationId: createProcessingJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "200":
          description: Job processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /ready:
    get:
      summary: Readiness check
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
components:
  schemas:
    CreateJobRequest:
      type: object
      required:
        - meeting_id
      properties:
        meeting_id:
          type: string
    JobResponse:
      type: object
      required:
        - meeting_id
        - status
      properties:
        meeting_id:
          type: string
        status:
          type: string
        transcript:
          type: string
        summary:
          type: string
    UploadResponse:
      type: object
      required:
        - audio_path
        - original_filename
      properties:
        audio_path:
          type: string
        original_filename:
          type: string
    ProcessStartRequest:
      type: object
      properties:
        meeting_id:
          type: integer
          format: int64
        audio_path:
          type: string
        file_id:
          type: string
        topic:
          type: string
        glossary_terms:
          type: array
          items:
            type: string
        language:
          type: string
    ProcessingStartResponse:
      type: object
      required:
        - meetingId
        - status
      properties:
        meetingId:
          type: integer
          format: int64
        status:
          type: string
        error:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
    ProcessingStatusResponse:
      type: object
      required:
        - meetingId
        - status
        - progress
        - stage
      properties:
        meetingId:
          type: integer
          format: int64
        status:
          type: string
        progress:
          type: integer
        stage:
          type: string
        error:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
    TranscriptPayload:
      type: object
      required:
        - meeting_id
        - status
        - transcripts
      properties:
        meeting_id:
          type: integer
          format: int64
        status:
          type: string
        transcripts:
          type: array
          items:
            type: object
            additionalProperties: true
    AnalysisPayload:
      type: object
      required:
        - meeting_id
        - status
      properties:
        meeting_id:
          type: integer
          format: int64
        status:
          type: string
        meetingId:
          type: integer
          format: int64
        data:
          $ref: "#/components/schemas/StructuredAnalysis"
        structuredAnalysis:
          $ref: "#/components/schemas/StructuredAnalysis"
      additionalProperties: true
    StructuredAnalysis:
      type: object
      required:
        - summary
        - keywords
        - technicalTerms
        - painPoints
        - actionItems
        - domainMode
      properties:
        summary:
          type: string
        keywords:
          type: array
          items:
            type: string
        technicalTerms:
          type: array
          items:
            $ref: "#/components/schemas/TechnicalTerm"
        painPoints:
          type: array
          items:
            $ref: "#/components/schemas/PainPoint"
        actionItems:
          type: array
          items:
            type: string
        domainMode:
          type: string
          enum: [general, it, business, education]
        evidence:
          $ref: "#/components/schemas/EvidenceBlock"
    EvidenceBlock:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisEvidenceMatch"
    AnalysisEvidenceMatch:
      type: object
      properties:
        verificationStatus:
          type: string
          x-epic3: true
        score:
          type: number
          x-epic3: true
        snippet:
          type: string
        speaker:
          type: string
        startTime:
          type: number
        endTime:
          type: number
        dedupeKey:
          type: string
          x-epic3: true
    TranscriptEvidenceMatch:
      type: object
      additionalProperties: false
      properties:
        evidenceId:
          type: string
        segmentId:
          type: string
        index:
          type: integer
        speaker:
          type: string
        startTime:
          type: number
        endTime:
          type: number
        text:
          type: string
        textTruncated:
          type: boolean
        score:
          type: number
          x-epic3: true
        rank:
          type: integer
        matchType:
          type: string
        verificationStatus:
          type: string
          x-epic3: true
        dedupeKey:
          type: string
          x-epic3: true
    TranscriptSearchResponse:
      type: object
      required:
        - meetingId
        - query
        - matches
      properties:
        meetingId:
          type: integer
          format: int64
        query:
          type: string
        normalizedQuery:
          type: string
        transcriptMode:
          type: string
        canonicalTranscriptHash:
          type: string
          nullable: true
        canonicalTranscriptVersion:
          type: string
          nullable: true
        matches:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptEvidenceMatch"
    ActionPlanResponse:
      type: object
      additionalProperties: true
      properties:
        meeting:
          type: object
          additionalProperties: true
        actionItems:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              task:
                type: string
              evidence:
                $ref: "#/components/schemas/TranscriptEvidenceMatch"
        groupedActionPlan:
          type: object
          additionalProperties: true
        analysisMetadata:
          type: object
          additionalProperties: true
    TechnicalTerm:
      type: object
      required:
        - term
        - meaning
        - category
      properties:
        term:
          type: string
        meaning:
          type: string
        category:
          type: string
    PainPoint:
      type: object
      required:
        - title
        - evidence
        - severity
      properties:
        title:
          type: string
        evidence:
          type: string
        severity:
          type: string
          enum: [low, medium, high]
    MeetingChatResponse:
      type: object
      properties:
        meetingId:
          type: integer
          format: int64
        answer:
          type: string
        provider:
          type: string
        source_segments:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptEvidenceMatch"
    SemanticSearchResponse:
      type: object
      properties:
        query:
          type: string
        provider:
          type: string
        results:
          type: array
          items:
            type: object
            additionalProperties: true
    CrossMeetingAskResponse:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
        provider:
          type: string
        meetings:
          type: array
          items:
            type: object
            additionalProperties: true
    StudyArtifactType:
      type: string
      enum:
        - MIND_MAP
        - FLASHCARDS
        - MULTIPLE_CHOICE
        - ESSAY_QUESTIONS
        - EXAM_BRIEF
    SourceSelectionMode:
      type: string
      enum:
        - ALL_READY
        - EXPLICIT
    StudyJobStatus:
      type: string
      enum:
        - QUEUED
        - PROCESSING
        - COMPLETED
        - FAILED
        - STALE
        - QUOTA_EXCEEDED
        - PARTIALLY_FAILED
    SubjectSynthesisRequest:
      type: object
      properties:
        meetingIds:
          type: array
          items:
            type: integer
            format: int64
        language:
          type: string
        sourceSelectionMode:
          $ref: "#/components/schemas/SourceSelectionMode"
    SubjectSynthesisResponse:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
          format: int64
        subjectId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/StudyJobStatus"
        version:
          type: integer
        cacheHit:
          type: boolean
        stale:
          type: boolean
        sourceMeetingIds:
          type: array
          items:
            type: integer
            format: int64
        content:
          type: object
          additionalProperties: true
          nullable: true
    StudyArtifactsRequest:
      type: object
      required:
        - subjectId
        - artifactTypes
      properties:
        subjectId:
          type: integer
          format: int64
        meetingIds:
          type: array
          items:
            type: integer
            format: int64
        artifactTypes:
          type: array
          items:
            $ref: "#/components/schemas/StudyArtifactType"
        sourceSelectionMode:
          $ref: "#/components/schemas/SourceSelectionMode"
        options:
          type: object
          additionalProperties: true
        synthesisId:
          type: integer
          format: int64
          nullable: true
    StudyArtifactResponse:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
          format: int64
        subjectId:
          type: integer
          format: int64
        artifactType:
          $ref: "#/components/schemas/StudyArtifactType"
        status:
          $ref: "#/components/schemas/StudyJobStatus"
        version:
          type: integer
        cacheHit:
          type: boolean
        stale:
          type: boolean
        content:
          type: object
          additionalProperties: true
          nullable: true
    StudyArtifactsResponse:
      type: object
      additionalProperties: true
      properties:
        artifactIds:
          type: array
          items:
            type: integer
            format: int64
        newlyCreatedArtifactIds:
          type: array
          items:
            type: integer
            format: int64
        cacheHitArtifactIds:
          type: array
          items:
            type: integer
            format: int64
        inFlightArtifactIds:
          type: array
          items:
            type: integer
            format: int64
        status:
          $ref: "#/components/schemas/StudyJobStatus"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/StudyArtifactResponse"
    StudyArtifactsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StudyArtifactResponse"
        status:
          $ref: "#/components/schemas/StudyJobStatus"
          nullable: true
      additionalProperties: true
