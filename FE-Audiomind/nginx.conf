server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Referrer-Policy "no-referrer" always;

    location = /auth/google/success {
        access_log off;
        rewrite ^ /index.html break;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
