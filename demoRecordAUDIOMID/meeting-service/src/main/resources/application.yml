server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8
    max-http-form-post-size: 210MB
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: ${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_meeting

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:86400}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

google:
  integration:
    user-service-url: ${GOOGLE_USER_SERVICE_URL:http://user-api:8083}
    internal-service-token: ${GOOGLE_INTERNAL_SERVICE_TOKEN:}
    calendar-api-base-url: ${GOOGLE_CALENDAR_API_BASE_URL:https://www.googleapis.com/calendar/v3}

user:
  service:
    url: ${USER_SERVICE_URL:http://user-api:8083}
epic2:
  error-ux-enabled: ${ERROR_UX_ENABLED:true}
  upload-validation-strict: ${UPLOAD_VALIDATION_STRICT:false}
  mime-sniff-enabled: ${MIME_SNIFF_ENABLED:false}
  realtime-validation-enabled: ${REALTIME_VALIDATION_ENABLED:false}
  upload-security-scan-enabled: ${UPLOAD_SECURITY_SCAN_ENABLED:false}
  upload-scan-fail-open: ${UPLOAD_SCAN_FAIL_OPEN:true}
