name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate monorepo structure
        run: |
          test -d demoRecordAUDIOMID/meeting-service || (echo "demoRecordAUDIOMID/meeting-service missing" && exit 1)
          test -d demoRecordAUDIOMID/processing-service || (echo "demoRecordAUDIOMID/processing-service missing" && exit 1)
          test -d demoRecordAUDIOMID/ai-service || (echo "demoRecordAUDIOMID/ai-service missing" && exit 1)
          test -d packages/contracts || (echo "packages/contracts missing" && exit 1)

      - name: Install deps (node)
        run: |
          npm ci

      - name: Validate transcript quality policy
        run: npm run validate:policy

      - name: Lint (TS)
        run: |
          npm run lint

      - name: Install Python deps
        run: |
          pip install -r demoRecordAUDIOMID/ai-service/requirements.txt \
            -r demoRecordAUDIOMID/ai-service/requirements-dev.txt

      - name: Lint Python
        run: |
          pip install ruff black
          ruff check demoRecordAUDIOMID/ai-service
          black --check demoRecordAUDIOMID/ai-service

      - name: Build Java
        run: |
          test -f demoRecordAUDIOMID/pom.xml || (echo "demoRecordAUDIOMID/pom.xml missing" && exit 1)
          cd demoRecordAUDIOMID
          chmod +x ./mvnw
          ./mvnw -B verify --no-transfer-progress -DskipTests

      - name: Run tests
        run: |
          cd FE-Audiomind
          npm test
          npx tsc --noEmit
          cd ..
          cd demoRecordAUDIOMID
          chmod +x ./mvnw
          ./mvnw test --no-transfer-progress
          cd ..
          python -m pytest demoRecordAUDIOMID/ai-service/tests --ignore=demoRecordAUDIOMID/ai-service/tests/stress

      - name: Note E2E
        run: |
          echo "Full-stack E2E runs in smoke-test.yml (PR/nightly) when E2E_USERNAME/E2E_PASSWORD secrets are set."

  contract-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Validate monorepo structure
        run: |
          test -d packages/contracts || (echo "packages/contracts missing" && exit 1)

      - name: Install deps (node)
        run: |
          npm ci

      - name: Fetch main branch
        run: git fetch origin main

      - name: Validate schemas
        run: |
          npm run validate:schema
          npm run validate:contracts

      - name: Log safety scan
        run: bash scripts/ci/log-safety-scan.sh

      - name: Validate transcript quality policy
        run: npm run validate:policy

      - name: Check OpenAPI breaking changes
        run: |
          npm run check:openapi

      - name: Generate client
        run: |
          npm run generate:client

      - name: Type check generated client
        run: |
          npx tsc --noEmit -p tsconfig.generated.json

      - name: Check client drift
        run: |
          git diff --exit-code -- packages/api-clients

  commit-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install deps (node)
        run: |
          npm ci

      - name: Validate commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose
          else
            npx commitlint --from HEAD~1 --to HEAD --verbose
          fi

  gate-a:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps (node)
        run: npm ci

      - name: Run Gate-A verification
        run: bash scripts/ci/gate-a-verify.sh

  quota-postgres-concurrency:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run QuotaConcurrencyTest (required Postgres / Docker)
        env:
          REQUIRE_POSTGRES_CONCURRENCY_TESTS: "true"
        run: |
          cd demoRecordAUDIOMID
          chmod +x ./mvnw
          ./mvnw -pl user-service -Pquota-postgres-it test --no-transfer-progress

      - name: Verify QuotaConcurrencyTest Surefire results
        run: node scripts/verify-quota-concurrency-results.mjs

  k8s-runtime-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps for AI tests
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest
          if [ -f demoRecordAUDIOMID/ai-service/requirements.txt ]; then
            pip install -r demoRecordAUDIOMID/ai-service/requirements.txt
          elif [ -f demoRecordAUDIOMID/ai-service/requirements-dev.txt ]; then
            pip install -r demoRecordAUDIOMID/ai-service/requirements-dev.txt
          fi

      - name: Verify kubectl client
        run: kubectl version --client

      - name: Render overlays
        run: |
          kubectl kustomize k8s/overlays/dev --load-restrictor=LoadRestrictionsNone > rendered-dev.yaml
          kubectl kustomize k8s/overlays/staging --load-restrictor=LoadRestrictionsNone > rendered-staging.yaml
          kubectl kustomize k8s/overlays/prod --load-restrictor=LoadRestrictionsNone > rendered-prod.yaml

      - name: Structural Secret/ConfigMap validation
        run: |
          python scripts/validate-rendered-k8s.py rendered-dev.yaml --environment dev
          python scripts/validate-rendered-k8s.py rendered-staging.yaml --environment staging
          python scripts/validate-rendered-k8s.py rendered-prod.yaml --environment prod

      - name: Required rendered component Settings tests
        env:
          REQUIRE_K8S_RENDER_TESTS: "true"
        working-directory: demoRecordAUDIOMID/ai-service
        run: |
          pytest tests/test_k8s_rendered_component_settings.py -q --tb=short

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Java JWT startup validator tests
        run: |
          cd demoRecordAUDIOMID
          chmod +x ./mvnw
          ./mvnw -pl meeting-service,processing-service,user-service \
            -Dtest=StartupConfigValidatorTest test --no-transfer-progress

  k8s-managed-database-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest
          if [ -f demoRecordAUDIOMID/ai-service/requirements.txt ]; then
            pip install -r demoRecordAUDIOMID/ai-service/requirements.txt
          fi
          if [ -f demoRecordAUDIOMID/ai-service/requirements-dev.txt ]; then
            pip install -r demoRecordAUDIOMID/ai-service/requirements-dev.txt
          fi

      - name: Verify kubectl client
        run: kubectl version --client

      - name: Render overlays
        run: |
          kubectl kustomize k8s/overlays/dev --load-restrictor=LoadRestrictionsNone > rendered-dev.yaml
          kubectl kustomize k8s/overlays/staging --load-restrictor=LoadRestrictionsNone > rendered-staging.yaml
          kubectl kustomize k8s/overlays/prod --load-restrictor=LoadRestrictionsNone > rendered-prod.yaml

      - name: Structural managed database validation
        run: |
          python scripts/validate-rendered-k8s.py rendered-dev.yaml --environment dev
          python scripts/validate-rendered-k8s.py rendered-staging.yaml --environment staging
          python scripts/validate-rendered-k8s.py rendered-prod.yaml --environment prod

      - name: Required managed database render tests
        env:
          REQUIRE_K8S_RENDER_TESTS: "true"
        working-directory: demoRecordAUDIOMID/ai-service
        run: |
          pytest tests/test_k8s_rendered_component_settings.py \
            tests/test_k8s_managed_database_wiring.py -q --tb=short

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Spring datasource context + Flyway tests
        env:
          REQUIRE_DATASOURCE_CONTEXT_TESTS: "true"
        run: |
          cd demoRecordAUDIOMID
          chmod +x ./mvnw
          ./mvnw -pl meeting-service,user-service \
            -Dtest=DatasourceContextStartupTest,DatasourceContextFailureTest,StartupConfigValidatorTest \
            test --no-transfer-progress

      - name: AI SQLAlchemy + Alembic database startup
        env:
          REQUIRE_DATASOURCE_CONTEXT_TESTS: "true"
        working-directory: demoRecordAUDIOMID/ai-service
        run: |
          pytest tests/test_database_startup.py -q --tb=short
